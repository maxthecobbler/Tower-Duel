<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TowerFight — Battlefield</title>
<style>
  :root {
    --bg:#141420; --panel:#1c1e2e; --panel2:#252840; --accent:#ffd75e;
    --you:#5fcde4; --bot:#ff6b6b; --green:#7ee77a; --orange:#ffa65a; --text:#e8edf5; --dim:#8a93ad; --good:#6ee77a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  button,input,.tool,#sceneSel button,#rangeBar button{touch-action:manipulation}
  #wrap{position:relative;width:min(96vw,940px);overflow:hidden;border-radius:8px}
  canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    border-radius:8px;border:2px solid #2c3050;background:#20283a;cursor:crosshair;touch-action:none}
  #hud{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;gap:14px;align-items:center;font-size:.88em;white-space:nowrap;
    background:rgba(14,17,28,.72);padding:4px 16px;border-radius:20px;border:1px solid #2c3050;
    backdrop-filter:blur(2px)}
  #hud .gold{color:var(--accent);font-weight:bold;font-size:1.1em}
  #hud .dim{color:var(--dim);font-size:.9em}
  #toolbar{display:flex;gap:5px;align-items:stretch;flex-wrap:wrap;justify-content:center;
    margin-top:10px;width:min(96vw,940px);
    background:var(--panel);padding:8px;border-radius:12px;border:1px solid #2c3050;
    transition:opacity .3s}
  #toolbar.away{opacity:.45;pointer-events:none}
  .tool{position:relative;background:var(--panel2);border:2px solid #333a5c;border-radius:8px;color:var(--text);
    font-family:inherit;padding:4px 7px;cursor:pointer;text-align:center;min-width:70px;transition:all .1s;user-select:none}
  .tool:hover:not(:disabled):not(.disabled){border-color:var(--accent);transform:translateY(-2px)}
  .tool.selected{border-color:var(--accent);background:#3a3417}
  .tool:disabled,.tool.disabled{opacity:.35;cursor:not-allowed}
  .tool .lvl{color:var(--good);font-size:.85em;font-weight:bold}
  .tool .up{position:absolute;top:-9px;right:-6px;background:#2a3f2b;border:1px solid var(--good);
    color:var(--good);border-radius:8px;font-family:inherit;font-size:.68em;font-weight:bold;
    padding:1px 5px;cursor:pointer;line-height:1.3}
  .tool .up:hover:not(:disabled){background:var(--good);color:#102412}
  .tool .up:disabled{opacity:.4;cursor:not-allowed}
  .tool .mod{position:absolute;top:-9px;left:-6px;background:#3a2a18;border:1px solid var(--orange);
    color:var(--orange);border-radius:8px;font-family:inherit;font-size:.62em;font-weight:bold;
    padding:1px 4px;cursor:pointer;line-height:1.3}
  .tool .mod:hover:not(:disabled){background:var(--orange)}
  .tool .mod.armed{background:var(--orange);color:#2a1a08;box-shadow:0 0 6px var(--orange)}
  .tool .mod:disabled{opacity:.4;cursor:not-allowed}
  .tool .ic{font-size:1.2em}
  .tool .nm{font-size:.75em;display:block}
  .tool .cs{color:var(--accent);font-size:.75em;font-weight:bold}
  #fight{background:var(--accent);color:#221a05;border:none;border-radius:8px;font-weight:bold;
    font-family:inherit;font-size:1.05em;padding:6px 22px;cursor:pointer;min-width:120px}
  #fight:hover:not(:disabled){filter:brightness(1.12)}
  #fight:disabled{opacity:.4;cursor:not-allowed}
  #msg{color:var(--dim);font-size:.85em;margin-top:6px;height:1.2em;text-align:center}
  #banner{display:none;position:absolute;inset:0;background:rgba(10,12,22,.78);border-radius:8px;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
  #banner.show{display:flex}
  #banner .big{font-size:2.2em;font-weight:bold;text-shadow:0 3px 12px #000}
  #banner .bannerBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #banner button{background:var(--accent);border:none;border-radius:8px;padding:10px 26px;
    font-family:inherit;font-weight:bold;font-size:1em;cursor:pointer;color:#221a05}
  #banner button:last-child{background:var(--panel2);color:var(--text);border:2px solid #333a5c}
  #menuBtn{position:absolute;top:6px;left:8px;z-index:4;background:rgba(14,17,28,.8);
    border:1px solid #2c3050;border-radius:8px;color:var(--text);font-family:inherit;font-size:.8em;
    font-weight:bold;padding:5px 10px;cursor:pointer;backdrop-filter:blur(2px)}
  #menuBtn:hover{border-color:var(--accent)}
  #menuBtn.hidden{display:none}
  kbd{background:#2c3050;border-radius:4px;padding:1px 5px;font-size:.85em}
  #menu{position:absolute;inset:0;background:rgba(10,12,22,.88);border-radius:8px;z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;padding:8px 0}
  /* centers content when it fits, scrolls without clipping the top when it doesn't */
  #menu::before,#menu::after{content:"";margin:auto;flex-shrink:0}
  #menu>*{flex-shrink:0}
  #menu.hidden{display:none}
  #menu h2{color:var(--accent);letter-spacing:2px;margin-bottom:6px}
  #menu button{background:var(--panel2);border:2px solid #333a5c;border-radius:10px;color:var(--text);
    font-family:inherit;font-size:1em;font-weight:bold;padding:10px 22px;cursor:pointer;min-width:240px}
  #menu button:hover{border-color:var(--accent)}
  #menu .joinrow{display:flex;gap:6px}
  #menu input{background:#10131f;border:2px solid #333a5c;border-radius:10px;color:var(--text);
    font-family:inherit;font-size:1em;padding:10px;width:130px;text-transform:uppercase;text-align:center;
    letter-spacing:3px}
  #menu .status{color:var(--dim);font-size:.9em;min-height:1.2em}
  #menu .code{color:var(--accent);font-size:1.6em;font-weight:bold;letter-spacing:6px}
  #verBtn{cursor:pointer;text-decoration:underline dotted}
  #verBtn:hover{color:var(--accent)}
  #sceneSel{display:flex;gap:6px;margin-bottom:4px}
  #sceneSel button{min-width:0;padding:7px 13px;font-size:.82em;opacity:.55;transition:opacity .1s}
  #sceneSel button:hover{opacity:.85}
  #sceneSel button.on{opacity:1;border-color:var(--accent);background:#3a3417}
  .soundRow{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.85em;margin-bottom:2px}
  .soundRow input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:8px;
    border-radius:5px;background:#333a5c;cursor:pointer;outline:none}
  .soundRow input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:transparent}
  .soundRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-3px;
    width:14px;height:14px;border-radius:50%;background:#f4f6fb;border:2px solid var(--accent);cursor:pointer}
  .soundRow input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:transparent}
  .soundRow input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#f4f6fb;border:2px solid var(--accent);cursor:pointer}
  .soundRow span{min-width:38px;text-align:right;color:var(--text)}
  #rangeBar{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;
    margin-top:8px;width:min(96vw,940px);color:var(--dim);font-size:.85em}
  #rangeBar button{background:var(--panel2);border:2px solid #333a5c;border-radius:8px;color:var(--text);
    font-family:inherit;font-size:.85em;padding:4px 12px;cursor:pointer;opacity:.7;transition:all .1s}
  #rangeBar button:hover{opacity:1;border-color:var(--accent)}
  #rangeBar button.on{opacity:1;border-color:var(--accent);background:#3a3417}
  .three-only{display:none}
  body.three .three-only{display:inline}
  .four-only{display:none}
  body.four .four-only{display:inline}
  .multi{display:none}
  body.three .multi,body.four .multi{display:inline}
  #notes{position:absolute;inset:0;background:rgba(10,12,22,.96);border-radius:8px;z-index:7;
    display:none;flex-direction:column;padding:14px 18px}
  #notes.show{display:flex}
  #notes h2{color:var(--accent);letter-spacing:2px;margin-bottom:8px;flex:none}
  #notesBody{overflow-y:auto;flex:1;font-size:.85em;line-height:1.5;padding-right:8px}
  #notesBody h3{color:var(--accent);margin:10px 0 2px;font-size:1.05em}
  #notesBody li{margin-left:18px;color:var(--text)}
  #notesClose{flex:none;align-self:center;margin-top:10px;background:var(--accent);border:none;
    border-radius:8px;padding:8px 24px;font-family:inherit;font-weight:bold;cursor:pointer;color:#221a05}
  #tip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:4;
    background:rgba(14,17,28,.95);border:1px solid var(--accent);border-radius:8px;
    padding:7px 12px;font-size:.8em;max-width:340px;text-align:center;color:var(--text);
    pointer-events:none;display:none}
  #tip b{color:var(--accent)}
  /* ---------- phones / narrow screens ---------- */
  @media (max-width:640px){
    body{padding:4px}
    #wrap,#toolbar{width:100vw}
    #hud{gap:6px;font-size:.66em;padding:3px 8px;flex-wrap:wrap;justify-content:center;max-width:97vw}
    #hud .gold{font-size:1em}
    #toolbar{gap:4px;padding:6px}
    .tool{min-width:0;flex:1 1 auto;padding:5px 4px}
    .tool .ic{font-size:1.05em}
    .tool .nm{font-size:.6em}
    .tool .cs{font-size:.62em}
    .tool .up{top:-7px;right:-4px;padding:2px 6px;font-size:.62em}   /* bigger tap target */
    #fight{font-size:1em;padding:8px 18px;min-width:0;flex:1 1 100%}
    #tip{max-width:92vw;font-size:.75em}
    #menu button{font-size:.95em;padding:11px 16px;min-width:0;width:88vw;max-width:320px}
    #sceneSel button,#rangeBar button{padding:8px 10px}   /* easier to tap */
    #sceneSel{max-width:96vw}
    #sceneSel button{width:auto}                          /* keep the scene row on one line, not 88vw each */
    #msg{font-size:.72em}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="448" height="240"></canvas>
  <div id="hud">
    <span><span id="turnWord">Turn</span> <b id="turnNo">1</b></span>
    <span class="gold">💰 <span id="gold">0</span></span>
    <span class="dim">+<span id="incomeLbl">0</span><span id="incomeUnit">/turn</span></span>
    <span style="color:#c9a0ff;font-weight:bold">🔮 <span id="magic">0</span></span>
    <span class="dim">+<span id="magicIncLbl">0</span><span id="magicIncUnit">/turn</span></span>
    <span class="dim">🔵 <b id="pHp" style="color:var(--you)"></b> HP · L<b id="pLv" style="color:var(--you)">1</b></span>
    <span class="dim multi"><b id="cEmo">●</b> <b id="cHp"></b> HP · L<b id="cLv">1</b></span>
    <span class="dim">🔴 <b id="bHp" style="color:var(--bot)"></b> HP · L<b id="bLv" style="color:var(--bot)">1</b></span>
    <span class="dim four-only"><b id="dEmo" style="color:var(--orange)">●</b> <b id="dHp" style="color:var(--orange)"></b> HP · L<b id="dLv" style="color:var(--orange)">1</b></span>
  </div>
  <div id="tip"></div>
  <button id="menuBtn" onclick="quitToMenu()">☰ Menu</button>
  <div id="banner"><div class="big" id="bannerText"></div>
    <div class="bannerBtns">
      <button onclick="bannerAction()">↺ Play Again</button>
      <button onclick="quitToMenu()">☰ Menu</button>
    </div>
  </div>
  <div id="menu">
    <h2>🏰 TOWERFIGHT <span id="verBtn" style="font-size:.5em;color:var(--dim)" onclick="showNotes()" title="Patch notes">5.18.13.7</span></h2>
    <div id="sceneSel">
      <button data-scene="forest" class="on">🌲 Forest</button>
      <button data-scene="beach">🏖️ Beach</button>
      <button data-scene="mountains">⛰️ Mountains</button>
    </div>
    <div class="soundRow" title="Sound effects volume">🔊 <input id="volSlider" type="range" min="0" max="100" value="70"><span id="volPct">70%</span></div>
    <div class="soundRow" title="Menu music volume">🎵 <input id="musSlider" type="range" min="0" max="100" value="50"><span id="musPct">50%</span></div>
    <div class="soundRow" title="Screen shake strength">💥 <input id="shakeSlider" type="range" min="0" max="200" value="100"><span id="shakePct">100%</span></div>
    <button onclick="menuBot()">🤖 Play vs Bot (turn-based)</button>
    <button onclick="menuBlitz()">⚡ Blitz vs Bot (real-time!)</button>
    <button onclick="menu3()">🔺 3-Player Free-for-All (vs 2 Bots)</button>
    <button onclick="menu2v2()">🤝 2v2 (you + bot ally vs 2 Bots)</button>
    <button onclick="menuCreate()">🔒 Create Private Room (2P)</button>
    <button onclick="menuCreate3()">🔺 Create 3-Player Room (online)</button>
    <div class="joinrow">
      <input id="joinCode" maxlength="4" placeholder="CODE">
      <button style="min-width:100px" onclick="menuJoin()">Join</button>
    </div>
    <div class="status" id="menuStatus"></div>
    <div class="code" id="menuCode"></div>
  </div>
  <div id="notes">
    <h2>📜 PATCH NOTES</h2>
    <div id="notesBody"></div>
    <button id="notesClose" onclick="hideNotes()">✕ Close</button>
  </div>
</div>
<div id="toolbar"></div>
<div id="rangeBar">
  <span>👁 Show ranges:</span>
  <button data-r="p">🔵 Blue</button>
  <button data-r="b">🔴 Red</button>
  <button data-r="c" class="three-only">🟢 Green</button>
  <button data-r="both">⚔ Both</button>
</div>
<div id="msg">Select a building or troop, then click your (left) side to place it. <kbd>Esc</kbd>/right-click to deselect.</div>

<script>
"use strict";

// ============================== CONSTANTS ==============================
const CELL=16, PAD=16;
let COLS=26, ROWS=13, W=COLS*CELL, H=ROWS*CELL;   // map size (mutable: 3-player uses a bigger board)
const P_MAXCOL=11, B_MINCOL=14;              // 2-player column territories (12-13 = no man's land)
// ----- multi-player state -----
let NP=2;                                    // number of players this match (2, 3, or 4)
let SIDES=["p","b"];                          // active sides
// TEAM maps each side to a team id. FFA (2p/3p): every side is its own team. 2v2: p,c = team 0; b,d = team 1.
let TEAM={p:0, b:1};
function sameTeam(a,b){ return TEAM[a]===TEAM[b]; }
function foe(a,b){ return TEAM[a]!==TEAM[b]; }   // true when a and b are on opposing teams (i.e. enemies)
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints>0);
const SIDE_META={                            // per-side identity (tint) — c=3rd player, d=4th (2v2 ally)
  p:{tint:"rgba(95,205,228,0.06)"}, b:{tint:"rgba(255,107,107,0.06)"},
  c:{tint:"rgba(126,231,122,0.06)"}, d:{tint:"rgba(255,166,90,0.06)"},
};
// triangle geometry for 3-player mode (field-space pixel coords), rebuilt in setMap
let TRI=null;
function triCentroid(t){ return {x:(t.p.x+t.b.x+t.c.x)/3, y:(t.p.y+t.b.y+t.c.y)/3}; }
function pointInTri(px,py,t){                 // barycentric inside-test
  const {p,b,c}=t, d=(b.y-c.y)*(p.x-c.x)+(c.x-b.x)*(p.y-c.y);
  const a=((b.y-c.y)*(px-c.x)+(c.x-b.x)*(py-c.y))/d;
  const bb=((c.y-p.y)*(px-c.x)+(p.x-c.x)*(py-c.y))/d;
  const cc=1-a-bb;
  return a>=-0.02 && bb>=-0.02 && cc>=-0.02;
}
function nearestVertexSide(px,py,t){          // which player's wedge a point falls in (Voronoi of the 3 corners)
  let best="p", bd=1e9;
  for(const s of ["p","b","c"]){ const d=hyp(px-t[s].x,py-t[s].y); if(d<bd){ bd=d; best=s; } }
  return best;
}
function setMap(cols,rows){
  COLS=cols; ROWS=rows; W=COLS*CELL; H=ROWS*CELL;
  const cv=document.getElementById("cv");
  if(cv){ cv.width=W+2*PAD; cv.height=H+2*PAD; if(typeof ctx!=="undefined" && ctx) ctx.imageSmoothingEnabled=false; }
  if(NP===3){
    TRI={ p:{x:CELL*1.4, y:H-CELL*1.4},      // bottom-left = you (blue)
          b:{x:W-CELL*1.4, y:H-CELL*1.4},    // bottom-right = red
          c:{x:W/2, y:CELL*1.4} };           // apex = green
    TRI.mid=triCentroid(TRI);
  } else TRI=null;
}
const TOWER_HP=200, START_GOLD=14, BASE_INCOME=8, HARVEST_INCOME=3;
const START_MAGIC=5, BASE_MAGIC=1;
const BATTLE_MAX=15;                          // seconds per battle phase

const KINDS = {
  wall:     {label:"Wall",     icon:"🧱", cost:3,  hp:40,  building:true},
  harvester:{label:"Harvester",icon:"🌾", cost:5,  hp:20,  building:true},
  turret:   {label:"Turret",   icon:"🗼", cost:8,  hp:30,  building:true, range:90, dmg:5, cd:1.4, aoe:22},
  spikes:   {label:"Spikes",   icon:"🪤", cost:7,  hp:1,   building:true, trap:true, dmg:15, rad:14},
  catapult: {label:"Catapult", icon:"🪨", cost:50, hp:40,  building:true, gw:2, range:800, cd:10, aoe:16, dmgBuilding:15, dmgTroop:5},
  duck:     {label:"Duck",     icon:"🦆", cost:6,  hp:16,  building:true, water:true, range:70, cd:1.0, slow:1.6, dmg:0.1},
  magicwell:{label:"Mana Well",icon:"🔮", cost:5,  hp:20,  building:true, magicWater:true},
  soldier:  {label:"Soldier",  icon:"⚔️", cost:4,  hp:10,  troop:true, spd:32, range:11, dmg:3, cd:0.7, aggro:60},
  archer:   {label:"Archer",   icon:"🏹", cost:6,  hp:9,   troop:true, spd:26, range:66, dmg:2, cd:0.9, aggro:95},
  brute:    {label:"Brute",    icon:"🛡️", cost:10, hp:38,  troop:true, spd:16, range:13, dmg:8, cd:1.2, aggro:38},
  fireball: {label:"Fireball", icon:"🔥", cost:8,  spell:true, dmg:14, dmgBuilding:7, dmgTower:5, radius:32},
  heal:     {label:"Heal",     icon:"💚", cost:6,  spell:true, instant:true, hps:2, dur:6, radius:16},
  shield:   {label:"Shield",   icon:"🫧", cost:8,  spell:true, instant:true, shield:10, radius:32},
};
// per-card tech upgrades, L1 = base stats. Applies to ALL your units of that kind (existing + future).
const TECH={
  wall:     [null,{cost:0,hp:40},              {cost:6, hp:55},              {cost:12,hp:75},              {cost:20,hp:100}],
  harvester:[null,{cost:0,inc:3},              {cost:8, inc:4},              {cost:14,inc:5},              {cost:22,inc:7}],
  magicwell:[null,{cost:0,inc:3},              {cost:8, inc:4},              {cost:14,inc:5},              {cost:22,inc:7}],
  turret:   [null,{cost:0,dmg:5,range:90,cd:1.4},{cost:10,dmg:6,range:98,cd:1.2},{cost:18,dmg:8,range:108,cd:1.0},{cost:30,dmg:10,range:120,cd:0.8}],
  spikes:   [null,{cost:0,dmg:15,rad:14},      {cost:8, dmg:20,rad:15},      {cost:14,dmg:26,rad:18},      {cost:22,dmg:33,rad:22}],
  catapult: [null,{cost:0,cd:10,dmgBuilding:15,dmgTroop:5},{cost:55,cd:7,dmgBuilding:18,dmgTroop:5},{cost:70,cd:5,dmgBuilding:22,dmgTroop:6},{cost:90,cd:3,dmgBuilding:27,dmgTroop:7}],
  duck:     [null,{cost:0,cd:1.0,slow:1.6},    {cost:6, cd:0.8,slow:2.0},    {cost:10,cd:0.65,slow:2.4},   {cost:16,cd:0.5,slow:3.0}],
  soldier:  [null,{cost:0,hp:10,dmg:3,cd:0.7}, {cost:8, hp:13,dmg:4,cd:0.62},{cost:14,hp:16,dmg:5,cd:0.55},{cost:22,hp:20,dmg:6,cd:0.48}],
  archer:   [null,{cost:0,hp:9,dmg:2,cd:0.9,range:66},{cost:8,hp:11,dmg:3,cd:0.8,range:74},{cost:14,hp:13,dmg:4,cd:0.7,range:82},{cost:22,hp:16,dmg:5,cd:0.6,range:92}],
  brute:    [null,{cost:0,spd:16,cd:1.2},      {cost:8, spd:20,cd:1.05},     {cost:14,spd:24,cd:0.9},      {cost:22,spd:29,cd:0.75}],
  fireball: [null,{cost:0,dmg:14,dmgBuilding:7,radius:32},{cost:10,dmg:17,dmgBuilding:9,radius:40},{cost:18,dmg:21,dmgBuilding:11,radius:48},{cost:28,dmg:26,dmgBuilding:13,radius:56}],
  heal:     [null,{cost:0,hps:2,radius:16},    {cost:8, hps:2.5,radius:24},  {cost:14,hps:3,radius:32},    {cost:22,hps:4,radius:40}],
  shield:   [null,{cost:0,radius:32},          {cost:8, radius:40},          {cost:14,radius:48},          {cost:22,radius:56}],
};

// ---- retro menu music: a looping chiptune played on the same tiny synth ----
let musVol=(()=>{ const v=parseFloat(localStorage.getItem("td_mus")); return isNaN(v)?0.5:v; })();  // 0..1
let musicGain=null, musicOn=false, musicTimer=null, musicNextT=0, musicStep=0, audioUnlocked=false;
const MUS_STEP=0.21;                                    // one 8th note (~143 BPM)
// Am | G | F | E — 4 bars of 8th notes; 0 = rest
const MELODY=[440,0,523,440,659,0,523,440,  392,0,494,392,587,0,494,392,
              349,0,440,349,523,0,440,523,  659,0,494,392,330,0,0,0];
const BASSLN=[220,0,165,0,220,0,165,0,  196,0,147,0,196,0,147,0,
              175,0,131,0,175,0,131,0,  165,0,247,0,165,0,247,0];
function setMusicVol(v){
  musVol=Math.max(0,Math.min(1,v));
  try{ localStorage.setItem("td_mus",musVol); }catch(e){}
  if(musicGain) musicGain.gain.value=musVol;
}
function musNote(freq,t,dur,type,vol){
  const a=ac(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+dur+.02);
}
function pumpMusic(){                                    // lookahead scheduler: queue notes ~0.4s ahead
  if(!musicOn) return;
  const a=ac();
  while(musicNextT < a.currentTime+0.4){
    const i=musicStep%MELODY.length;
    if(MELODY[i]) musNote(MELODY[i],musicNextT,MUS_STEP*0.95,"square",.045);
    if(BASSLN[i]) musNote(BASSLN[i],musicNextT,MUS_STEP*1.9,"triangle",.08);
    musicStep++; musicNextT+=MUS_STEP;
  }
}
function startMusic(){
  if(musicOn || !audioUnlocked) return;
  try{
    const a=ac();
    if(!musicGain){ musicGain=a.createGain(); musicGain.gain.value=musVol; musicGain.connect(a.destination); }
    musicOn=true; musicStep=0; musicNextT=a.currentTime+.05;
    musicTimer=setInterval(pumpMusic,120); pumpMusic();
  }catch(e){}
}
function stopMusic(){
  musicOn=false;
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
}

    const tx=v.x+dx/m*CELL*3, ty=v.y+dy/m*CELL*3;      // sit inside from the sharp corner, room to build around

      x:tx, y:ty, hp:TOWER_HP, maxHp:TOWER_HP, cd:0};

function nearestEnemyTower(e){

// ============================== PLACEMENT ==============================
function inTerritory(side,gx,gy){
  if(NP===3 && TRI){                              // 3-player: your wedge of the triangle (Voronoi of the corners)
    const cx=cellCx(gx), cy=cellCx(gy);
    return pointInTri(cx,cy,TRI) && nearestVertexSide(cx,cy,TRI)===side;
  }
  if(NP===4){                                     // 2v2: shared team half — you can build anywhere on your team's side
    const left = gx>=0 && gx<=P_MAXCOL, right = gx>=B_MINCOL && gx<COLS;
    return TEAM[side]===0 ? left : right;          // team A (p,c) = whole left · team B (b,d) = whole right
  }
  return side==="p" ? gx>=0&&gx<=P_MAXCOL : gx>=B_MINCOL&&gx<COLS;
}
function bagAt(gx,gy){ return moneybags.some(b=>b.gx===gx && b.gy===gy); }
function validSpot(side,gx,gy,kind){
  const gw=(KINDS[kind]&&KINDS[kind].gw)||1, gh=(KINDS[kind]&&KINDS[kind].gh)||1;
  for(let dx=0;dx<gw;dx++)for(let dy=0;dy<gh;dy++){    // every cell of the footprint must be free & legal
    const cx=gx+dx, cy=gy+dy;
    if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return false;
    if(!inTerritory(side,cx,cy)) return false;
    if(occupied(cx,cy) || bagAt(cx,cy)) return false;
    if(kind==="duck"){       const p=pondAt(cx,cy); if(!(p && !p.magic)) return false; }   // BLUE water
    else if(kind==="magicwell"){ const p=pondAt(cx,cy); if(!(p && p.magic)) return false; } // PURPLE water
    else if(blockedCell(cx,cy)) return false;
  }
  return true;
}
function canPlace(gx,gy){
  if(selected==="sell") return false;
  if(selected && KINDS[selected] && KINDS[selected].spell) return canPlaceSpell(gx,gy);
  if(selected && KINDS[selected] && KINDS[selected].troop && troopCount(mySide)>=TROOP_LIMIT) return false;
  return canBuild() && validSpot(mySide,gx,gy,selected);
}
function sellableAt(side,gx,gy){
  return ents.find(o=>!o.dead && !o.selling && o.side===side && o.building && o.kind!=="tower" &&
    o.gx!==undefined && gx>=o.gx && gx<o.gx+(o.gw||1) && gy>=o.gy && gy<o.gy+(o.gh||1));
}
function sellAt(gx,gy){
  if(!canBuild()) return;
  const e=sellableAt(mySide,gx,gy);
  if(!e){ setMsgText("Nothing of yours to sell there."); return; }
  let refund;
  if(e.pending){
    // undo a placement made this turn (online): full refund, cancel its pending order
    refund=KINDS[e.kind].cost;
    golds[mySide]+=refund;
    e.dead=true; ents=ents.filter(o=>!o.dead);
    for(let i=myOrders.length-1;i>=0;i--){          // drop the matching place order
      const o=myOrders[i];
      if(o.kind===e.kind && o.gx===e.gx && o.gy===e.gy){ myOrders.splice(i,1); break; }
    }
  } else {
    // committed building: 50% refund, cell frees immediately for a replacement
    refund=Math.floor(KINDS[e.kind].cost*SELL_RATE);
    golds[mySide]+=refund;
    if(mode==="online"){
      e.selling=true;                               // kept (hidden) until the canonical sell resolves
      myOrders.push({kind:"sell",gx:e.gx,gy:e.gy});
    } else {
      e.dead=true; ents=ents.filter(o=>!o.dead);
    }
  }
  floatText(e.x,e.y-12,"+"+refund+" 💰",PAL.gold);
  for(let i=0;i<6;i++) parts.push({x:e.x,y:e.y,vx:rnd(-35,35),vy:rnd(-50,-15),life:rnd(.35,.6),t:0,size:rnd(1,2),color:PAL.gold});
  sfx("coin");
  refreshUI();
}
function canPlaceSpell(gx,gy){ return canBuild() && gx>=0 && gx<COLS && gy>=0 && gy<ROWS; }
// GOLD cost of an order list (spells excluded — they cost magic)
function costOfSide(side,orders){
  let s=0, lvl=(towerOf(side)||{level:1}).level;
  const tl={};
  for(const o of orders){
    if(o.kind==="upgrade"){ lvl=Math.min(4,lvl+1); s+=TOWER_LEVELS[lvl].cost; }
    else if(o.kind==="tech" && TECH[o.card]){
      const nx=Math.min(4,(tl[o.card] ?? techLvl(side,o.card))+1);
      tl[o.card]=nx; s+=TECH[o.card][nx].cost;
    }
    else if(o.kind==="sell"){                     // sells are NEGATIVE cost (a refund)
      const e=ents.find(t=>!t.dead && t.side===side && t.building && t.kind!=="tower" &&
        t.gx===o.gx && t.gy===o.gy);
      if(e) s-=Math.floor(KINDS[e.kind].cost*SELL_RATE);
    }
    else if(o.kind==="mod"){ s+=(MODIFIERS[o.card]?MODIFIERS[o.card].cost:9999); }
    else if(KINDS[o.kind] && KINDS[o.kind].spell){ /* magic, handled by costMagicOf */ }
    else s+=(KINDS[o.kind]?KINDS[o.kind].cost:9999);
  }
  return s;
}
// MAGIC cost of an order list
function costMagicOf(orders){
  return orders.reduce((s,o)=>s+(KINDS[o.kind]&&KINDS[o.kind].spell?KINDS[o.kind].cost:0),0);
}
function spawn(side,kind,gx,gy,pending){
  const k=KINDS[kind];
  const e = k.building ? makeBuilding(side,kind,gx,gy) : makeTroop(side,kind,cellCx(gx),cellCx(gy));
  if(pending) e.pending=true;
  ents.push(e);
  return e;
}
function place(kind,gx,gy){
  if(!canBuild()) return;
  const k=KINDS[kind];
  if(k.spell){
    if(magics[mySide]<k.cost || !canPlaceSpell(gx,gy)) return;   // spells cost MAGIC
    magics[mySide]-=k.cost;
    const x=cellCx(gx), y=cellCx(gy);
    myMarkers.push({x,y,kind});
    if(mode==="online") myOrders.push({kind,gx,gy});
    else spellsQueued.push({side:mySide,x,y,kind});
    if(RT) launchSpells();                        // Blitz: spells fire the moment you cast them
    puff(x,y, kind==="heal"?"#6ee77a":"#ff9c40", 8);
    sfx("place");
    refreshUI();
    return;
  }
  if(k.troop && troopCount(mySide)>=TROOP_LIMIT){ setMsgText(`Troop limit: max ${TROOP_LIMIT} troops alive at once.`); return; }
  if(golds[mySide]<k.cost || !validSpot(mySide,gx,gy,kind)) return;
  golds[mySide]-=k.cost;
  spawn(mySide,kind,gx,gy, mode==="online");
  if(mode==="online") myOrders.push({kind,gx,gy});
  puff(cellCx(gx),cellCx(gy), mySide==="p"?PAL.you:PAL.bot, 8);
  sfx("place");
  refreshUI();
}

// ============================== BOT AI ==============================
// Bot decision numbers LEARNED via self-play (cross-entropy method): this set beat the
// hand-tuned baseline ~92% over 200 games. Strategy it found: greedy economy, lean turrets,
// prioritize tower upgrades, and pour spare gold into constant soldier pressure.
const BOT_PARAMS = {
  harvBase:3, harvPerTurn:1, harvCap:8, ecoPerCall:3, ecoDefMargin:11, ecoBuffer:7,
  wallMax:3, wallBuffer:5,
  turretBase:1, turretPerTurn:2, turretCap:3, turretBuffer:9,
  duckTroopThresh:4, duckBuffer:5,
  spikeTroopThresh:2, spikeMax:2, spikeBuffer:6,
  techBuffer:12, towerUpBuffer:19,
  waveBudgetHigh:13, waveDefMargin:4, waveBudgetLow:8,
  bruteWallThresh:3, bruteTurretThresh:2,
  fireballThresh:13,
  harvCap2:7, spareHarvBuffer:12, spareSoldierBuffer:1,
};
// 2-player bot, side-generalized (plays either side; columns mirror for side "p") and parameterized by P.
function botBuild(side="b", P=BOT_PARAMS){
  const opp = side==="b"?"p":"b";
  const M = side==="b" ? (c=>c) : (c=>COLS-1-c);            // mirror b-frame columns onto side p
  const [scanLo,scanHi] = side==="b" ? [B_MINCOL,COLS] : [0,P_MAXCOL+1];
  const mine =k=>ents.filter(e=>e.side===side&&e.kind===k&&!e.dead);
  const foes =k=>ents.filter(e=>e.side===opp&&e.kind===k&&!e.dead);
  const enemyTroops=ents.filter(e=>e.side===opp&&e.troop&&!e.dead);
  const myTroops=()=>ents.filter(e=>e.side===side&&e.troop&&!e.dead);
  const dps=e=>tstat(e.side,e.kind,"dmg")/tstat(e.side,e.kind,"cd");
  const enemyPower=enemyTroops.reduce((s,e)=>s+dps(e),0);
  const myDefPower=mine("turret").reduce((s,e)=>s+dps(e),0)+mine("wall").length*1.5;

  function placeAt(kind,gx,gy){
    const k=KINDS[kind];
    if(golds[side]<k.cost) return false;
    if(k.troop && troopCount(side)>=TROOP_LIMIT) return false;
    if(!validSpot(side,gx,gy,kind)) return false;
    golds[side]-=k.cost;
    spawn(side,kind,gx,gy);
    puff(cellCx(gx),cellCx(gy),teamCol(side),8);
    return true;
  }
  function placeNear(kind,gx,gy,spread){
    if(placeAt(kind,gx,gy)) return true;
    for(let tries=0;tries<20;tries++){
      const x=gx+Math.floor(rnd(-spread,spread+1)), y=gy+Math.floor(rnd(-spread,spread+1));
      if(placeAt(kind,x,y)) return true;
    }
    return false;
  }

  // ---- 1) mana wells: claim the purple pond (up to 2) ----
  if(mine("magicwell").length<2){
    outer:
    for(let gx=scanLo;gx<scanHi;gx++)
      for(let gy=0;gy<ROWS;gy++)
        if(validSpot(side,gx,gy,"magicwell")){ placeAt("magicwell",gx,gy); break outer; }
  }

  // ---- 2) economy: grow harvesters toward a turn-scaled target ----
  const harvTarget=Math.min(P.harvCap, P.harvBase+Math.floor(turn/P.harvPerTurn));
  let ecoBuilt=0;
  while(mine("harvester").length<harvTarget && ecoBuilt<P.ecoPerCall && enemyPower<myDefPower+P.ecoDefMargin && golds[side]>=KINDS.harvester.cost+P.ecoBuffer){
    const row = mine("harvester").length%2===0 ? Math.floor(rnd(0,3)) : Math.floor(rnd(10,13));
    if(!placeNear("harvester",M(Math.floor(rnd(21,25))),row,2)) break;
    ecoBuilt++;
  }

  // ---- 3) defense: wall line + turrets scaled to the threat ----
  if(enemyPower>myDefPower){
    let wallsBuilt=0;
    for(const r of [5,6,7,4,8]){
      if(wallsBuilt>=P.wallMax || golds[side]<KINDS.wall.cost+P.wallBuffer) break;
      if(placeAt("wall",M(20),r)||placeAt("wall",M(19),r)) wallsBuilt++;
    }
    while(mine("turret").length<Math.min(P.turretCap,P.turretBase+Math.floor(turn/P.turretPerTurn)) && golds[side]>=KINDS.turret.cost+P.turretBuffer){
      if(!placeNear("turret",M(22),5+Math.floor(rnd(-1,3)),2)) break;
    }
    if(enemyTroops.length>=P.duckTroopThresh && mine("duck").length<1 && golds[side]>=KINDS.duck.cost+P.duckBuffer){
      outer2:
      for(let gx=scanLo;gx<scanHi;gx++)
        for(let gy=0;gy<ROWS;gy++){
          const p=pondAt(gx,gy);
          if(p&&!p.magic&&validSpot(side,gx,gy,"duck")){ placeAt("duck",gx,gy); break outer2; }
        }
    }
    if(enemyTroops.length>=P.spikeTroopThresh && mine("spikes").length<P.spikeMax && golds[side]>=KINDS.spikes.cost+P.spikeBuffer){
      placeNear("spikes",M(18),5+Math.floor(rnd(-2,3)),2);
    }
  }

  // ---- 4) tech ----
  const techWish=[];
  if(mine("harvester").length>=3) techWish.push("harvester");
  if(mine("magicwell").length>=1 && techLvl(side,"magicwell")<2) techWish.push("magicwell");
  if(mine("turret").length>=2) techWish.push("turret");
  if(enemyTroops.length>=3) techWish.push("wall");
  techWish.push(foes("wall").length>=3 ? "brute" : "soldier");
  if(turn>=5) techWish.push("archer","fireball");
  for(const card of techWish){
    if(techLvl(side,card)>=4) continue;
    const cost=TECH[card][techLvl(side,card)+1].cost;
    if(golds[side]>=cost+P.techBuffer){ golds[side]-=cost; applyTech(side,card); }
    break;
  }

  // ---- 5) tower upgrade on surplus ----
  {
    const t=towerOf(side);
    if(t && t.level<4){
      const cost=TOWER_LEVELS[t.level+1].cost;
      if(golds[side]>=cost+P.towerUpBuffer){ golds[side]-=cost; applyUpgrade(side); }
    }
  }

  // ---- 5b) siege: a catapult behind the lines when flush with gold ----
  if(mine("catapult").length<1 && turn>=5 && golds[side]>=KINDS.catapult.cost+20){
    placeNear("catapult", M(24), 5+Math.floor(rnd(-2,3)), 2);
  }

  // ---- 6) attack wave: pick the enemy's weakest row and push ----
  const laneDef=r=>ents.filter(e=>e.side===opp&&e.building&&!e.dead&&Math.abs(e.gy-r)<=1)
    .reduce((s,e)=>s+(e.kind==="turret"?3:e.kind==="tower"?4:1),0);
  let lane=6, bestDef=1e9;
  for(const r of [1,3,5,6,7,9,11]){ const d=laneDef(r)+rnd(0,.5); if(d<bestDef){bestDef=d;lane=r;} }
  const waveBudget=golds[side];
  if(waveBudget>=P.waveBudgetHigh || (enemyPower>myDefPower+P.waveDefMargin && waveBudget>=P.waveBudgetLow)){
    const wantBrute = foes("wall").length>=P.bruteWallThresh || foes("turret").length>=P.bruteTurretThresh;
    if(wantBrute && golds[side]>=KINDS.brute.cost) placeNear("brute",M(14),lane,1);
    placeNear("soldier",M(15),lane===12?11:lane+1,1);
    if(golds[side]>=KINDS.archer.cost) placeNear("archer",M(16),lane,1);
    else placeNear("soldier",M(15),lane===0?1:lane-1,1);
  }

  // ---- 7) spells: fireball value-scored, then shield + heal on a real push ----
  if(turn>=2 && magics[side]>=KINDS.fireball.cost){
    const r=tstat(side,"fireball","radius");
    const targets=ents.filter(e=>e.side===opp&&!e.dead);
    let best=null, bestScore=0;
    for(const c of targets){
      if(c.kind==="tower") continue;
      let s=0;
      for(const o of targets){
        if(hyp(o.x-c.x,o.y-c.y)<=r)
          s += o.kind==="harvester" ? 8+(o.harvested||0)*.25
             : o.kind==="magicwell" ? 8+(o.harvested||0)*.25
             : o.kind==="turret"    ? 7
             : o.kind==="wall"      ? 2
             : o.troop              ? 3 : 1;
      }
      if(s>bestScore){ bestScore=s; best=c; }
    }
    if(best && bestScore>=P.fireballThresh){
      magics[side]-=KINDS.fireball.cost;
      spellsQueued.push({side,x:best.x,y:best.y,kind:"fireball"});
    }
  }
  const wave=myTroops();
  if(wave.length>=3){
    const cx=wave.reduce((s,e)=>s+e.x,0)/wave.length, cy=wave.reduce((s,e)=>s+e.y,0)/wave.length;
    if(magics[side]>=KINDS.shield.cost){ magics[side]-=KINDS.shield.cost; spellsQueued.push({side,x:cx,y:cy,kind:"shield"}); }
    if(magics[side]>=KINDS.heal.cost){
      magics[side]-=KINDS.heal.cost;
      const dir=side==="b"?-1:1, hx=Math.max(30,Math.min(W-30,cx+dir*45));   // zone ahead of the wave
      spellsQueued.push({side,x:hx,y:cy,kind:"heal"});
    }
  }

  // ---- 8) spare change ----
  if(golds[side]>=KINDS.harvester.cost+P.spareHarvBuffer && mine("harvester").length<P.harvCap2)
    placeNear("harvester",M(Math.floor(rnd(21,25))),Math.floor(rnd(0,13)),2);
  if(golds[side]>=KINDS.soldier.cost+P.spareSoldierBuffer) placeNear("soldier",M(15),lane,2);
}

// simpler free-for-all bot for the triangular 3-player board (one call per bot side)
function botBuild3(side){
  const tw=towerOf(side); if(!tw || tw.dead) return;
  const mine=k=>ents.filter(e=>e.side===side&&e.kind===k&&!e.dead);
  const gold=()=>golds[side];
  const tryPlace=(kind)=>{
    const k=KINDS[kind]; if(gold()<k.cost) return false;
    for(let i=0;i<40;i++){                            // random cell in a ring around the bot's tower
      const ang=rnd(0,Math.PI*2), rad=rnd(CELL*1.5,CELL*8);
      const gx=Math.round((tw.x+Math.cos(ang)*rad)/CELL-0.5), gy=Math.round((tw.y+Math.sin(ang)*rad)/CELL-0.5);
      if(kind==="duck"||kind==="magicwell"){ const p=pondAt(gx,gy); if(!p||((kind==="duck")===!!p.magic)) continue; }
      if(validSpot(side,gx,gy,kind)){ golds[side]-=k.cost; spawn(side,kind,gx,gy); puff(cellCx(gx),cellCx(gy),teamCol(side),8); return true; }
    }
    return false;
  };
  if(mine("harvester").length<Math.min(6,2+Math.floor(turn/2)) && gold()>=KINDS.harvester.cost+3) tryPlace("harvester");
  if(mine("magicwell").length<1 && gold()>=KINDS.magicwell.cost) tryPlace("magicwell");
  if(mine("turret").length<Math.min(4,1+Math.floor(turn/3)) && gold()>=KINDS.turret.cost+2) tryPlace("turret");
  if(rnd(0,1)<0.5 && gold()>=KINDS.wall.cost+2) tryPlace("wall");
  if(rnd(0,1)<0.3 && gold()>=KINDS.spikes.cost+2) tryPlace("spikes");
  if(mine("catapult").length<1 && turn>=5 && gold()>=KINDS.catapult.cost+20) tryPlace("catapult");
  if(tw.level<4 && gold()>=TOWER_LEVELS[tw.level+1].cost+16 && rnd(0,1)<0.5){ golds[side]-=TOWER_LEVELS[tw.level+1].cost; applyUpgrade(side); }
  else if(turn>=2 && rnd(0,1)<0.5){
    const cards=["harvester","turret","soldier","archer"], card=cards[Math.floor(rnd(0,cards.length))];
    if(techLvl(side,card)<4){ const c=TECH[card][techLvl(side,card)+1].cost; if(gold()>=c+10){ golds[side]-=c; applyTech(side,card); } }
  }
  // attack wave: troops spawn just outside the tower, aimed at the field centre → they march at the nearest enemy tower
  const mid = TRI ? TRI.mid : {x:W/2, y:H/2};       // 2v2 has no triangle — aim at the map centre
  const dx=mid.x-tw.x, dy=mid.y-tw.y, m=hyp(dx,dy)||1;
  const troopKinds = turn>4 ? ["soldier","archer","brute"] : ["soldier","archer"];
  let guard=0;
  while(troopCount(side)<TROOP_LIMIT && guard++<6){
    const kind=troopKinds[Math.floor(rnd(0,troopKinds.length))];
    if(gold()<KINDS[kind].cost || (gold()<10 && rnd(0,1)<0.5)) break;
    const off=CELL*(2+rnd(0,1.5));
    const gx=Math.round((tw.x+dx/m*off+rnd(-6,6))/CELL-0.5), gy=Math.round((tw.y+dy/m*off+rnd(-6,6))/CELL-0.5);
    golds[side]-=KINDS[kind].cost; spawn(side,kind,gx,gy); puff(cellCx(gx),cellCx(gy),teamCol(side),6);
  }
  // spells: fireball the densest ENEMY cluster; shield/heal own pushes (makes waves actually break through)
  if(turn>=2 && magics[side]>=KINDS.fireball.cost){
    const r=tstat(side,"fireball","radius"), targets=ents.filter(e=>!e.dead && foe(e.side,side));
    let best=null, bs=0;
    for(const c of targets){ if(c.kind==="tower") continue; let s2=0;
      for(const o of targets) if(hyp(o.x-c.x,o.y-c.y)<=r) s2+= o.kind==="harvester"?8 : o.kind==="magicwell"?8 : o.kind==="turret"?7 : o.kind==="wall"?2 : o.troop?3 : 1;
      if(s2>bs){ bs=s2; best=c; } }
    if(best && bs>=9){ magics[side]-=KINDS.fireball.cost; spellsQueued.push({side,x:best.x,y:best.y,kind:"fireball"}); }
  }
  const myWave=ents.filter(e=>e.side===side&&e.troop&&!e.dead);
  if(myWave.length>=2){
    const cx=myWave.reduce((s,e)=>s+e.x,0)/myWave.length, cy=myWave.reduce((s,e)=>s+e.y,0)/myWave.length;
    if(magics[side]>=KINDS.shield.cost){ magics[side]-=KINDS.shield.cost; spellsQueued.push({side,x:cx,y:cy,kind:"shield"}); }
    else if(magics[side]>=KINDS.heal.cost){ magics[side]-=KINDS.heal.cost; spellsQueued.push({side,x:cx,y:cy,kind:"heal"}); }
  }
}
// 2v2 offline: your bot teammate(s) build at the START of the build phase, so you can SEE their placements while you plan
function allyBuild(){
  if(mode!=="bot" || NP!==4) return;
  for(const s of SIDES) if(s!==mySide && sameTeam(s,mySide)) botBuild3(s);
}

// ============================== COMBAT SIM ==============================
function nearestEnemy(e, troopsOnly=false){
  let best=null, bd=1e9;
  for(const o of ents){
    if(!foe(o.side,e.side)) continue;
    if(troopsOnly && !o.troop) continue;
    const d=dist(e,o);
    if(d<bd){ bd=d; best=o; }
  }
  return best?{t:best,d:bd}:null;
}
// catapult targeting: the nearest enemy BUILDING within range (traps excluded — they're hidden)
function nearestEnemyBuilding(e, range){
  let best=null, bd=1e9;
  for(const o of ents){
    if(o.dead || !foe(o.side,e.side) || !o.building || o.kind==="spikes") continue;
    const d=dist(e,o);
    if(d<bd){ bd=d; best=o; }
  }
  return (best && bd<=range) ? {t:best,d:bd} : null;
}
// body radius used for surface-to-surface range checks & collision
function bodyR(o){ return o.kind==="tower"?15 : o.kind==="catapult"?11 : o.building?7 : 3; }
// priority inside detection radius: enemy troops > money bags > enemy buildings
function acquireTarget(e, aggro){
  let bestT=null,bdT=1e9, bestB=null,bdB=1e9, bestBag=null,bdBag=1e9;
  for(const o of ents){
    if(o.dead || !foe(o.side,e.side) || o.kind==="spikes") continue;   // traps are hidden — never targeted
    const d=dist(e,o) - bodyR(o);
    if(d>aggro) continue;
    if(o.troop){ if(d<bdT){bdT=d;bestT=o;} }
    else       { if(d<bdB){bdB=d;bestB=o;} }
  }
  for(const b of moneybags){
    const d=hyp(e.x-b.x,e.y-b.y);
    if(d<=aggro && d<bdBag){ bdBag=d; bestBag=b; }
  }
  if(bestT)   return {t:bestT,d:bdT};
  if(bestBag) return {t:{x:bestBag.x,y:bestBag.y}, d:bdBag, bag:true};
  if(bestB)   return {t:bestB,d:bdB};
  return null;
}
// enemy buildings physically block troops (walls actually wall things off)
function collideBuildings(e){
  for(const o of ents){
    if(o.dead || !o.building || !foe(o.side,e.side) || o.kind==="spikes") continue;  // troops walk over traps

    const r=bodyR(o)+3;
    const dx=e.x-o.x, dy=e.y-o.y, d=hyp(dx,dy);
    if(d<r && d>0.001){ e.x=o.x+dx/d*r; e.y=o.y+dy/d*r; }
  }
}
function damage(target,dmg,srcColor){
  if(target.dead) return;                 // never re-trigger death effects (bounty/explosion)
  // shield bubbles absorb damage first
  if(target.shield>0){
    const ab=Math.min(target.shield,dmg);
    target.shield-=ab; dmg-=ab;
    puff(target.x,target.y-4,"#7db4ff",3);
    if(dmg<=0){ floatText(target.x,target.y-8,"blocked","#7db4ff"); return; }
  }
  target.hp-=dmg;
  floatText(target.x+rnd(-3,3), target.y-8, "-"+dmg, srcColor);
  if(target.hp<=0){
    const big = target.kind==="tower"||target.kind==="brute";
    boom(target.x,target.y, teamCol(target.side), big?22:12, big);
    target.dead=true;
    // harvester/mana well bounty: killer loots 25% of its lifetime earnings (in its currency)
    if(target.kind==="harvester"||target.kind==="magicwell"){
      const bounty=Math.floor((target.harvested||0)*0.25);
      if(bounty>0){
        const looter = SIDES.find(s=>foe(s,target.side)) || (target.side==="p"?"b":"p");   // bounty to an enemy, never a teammate
        const magic = target.kind==="magicwell";
        if(magic) magics[looter]+=bounty; else golds[looter]+=bounty;
        floatText(target.x, target.y-14, "+"+bounty+(magic?" 🔮":" 💰"), magic?"#c9a0ff":PAL.gold);
        for(let i=0;i<6;i++)                         // loot scatters from the wreck
          parts.push({x:target.x,y:target.y,vx:rnd(-40,40),vy:rnd(-60,-20),life:rnd(.4,.7),t:0,
            size:rnd(1,2),color:magic?"#c9a0ff":PAL.gold});
        sfx("coin");
        refreshUI();
      }
    }
    // harvesters are volatile: they explode on death, hurting everything NOT on their side (2-tile radius)
    if(target.kind==="harvester"){
      boom(target.x,target.y,"#ffd75e",22,true);
      for(let i=0;i<12;i++){                          // grain blast ring
        const a=i/12*Math.PI*2, s2=rnd(40,80);
        parts.push({x:target.x,y:target.y,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,life:rnd(.3,.5),t:0,
          size:rnd(1,2.5), color:Math.random()<.5?"#ffd75e":"#c9a24b"});
      }
      for(const o of ents){
        if(o.dead || o===target || sameTeam(o.side,target.side)) continue;
        if(hyp(o.x-target.x,o.y-target.y) <= 32+bodyR(o)) damage(o,12,"#ffd75e");
      }
    }
    if(target.kind==="tower"){
      if(NP>=3) eliminatePlayer(target.side);      // 3p FFA & 2v2 both eliminate on tower death
      else endGame(target.side==="b");
    }
  }
}
function shoot(e,target,opts){
  const spd=opts.spd||130;
  const sx=e.x, sy=e.y-(opts.lift||0);            // actual spawn point (lift is visual height)
  // lead the target: aim where it will be when the projectile arrives (2 refinement passes)
  let ax=target.x, ay=target.y;
  for(let i=0;i<2;i++){
    const tt=(hyp(ax-sx,ay-sy)||1)/spd;
    ax=target.x+(target.vx||0)*tt; ay=target.y+(target.vy||0)*tt;
  }
  const d=hyp(ax-sx,ay-sy)||1;                    // aim FROM the spawn point, not the body center
  projs.push({x:sx,y:sy,vx:(ax-sx)/d*spd,vy:(ay-sy)/d*spd,
    side:e.side, dmg:opts.dmg, aoe:opts.aoe||0, color:opts.color, size:opts.size||1.5, life:1.6,
    pkind:opts.pkind||"arrow", slow:opts.slow||0, burn:opts.burn||0});
  parts.push({x:e.x,y:e.y-(opts.lift||0),vx:0,vy:0,life:.08,t:0,size:3,color:PAL.flash,flash:true});
  sfx("shoot");
}
// catapult: lob a boulder that ARCS over troops and detonates on the targeted building's tile
function lobBoulder(e,target){
  const sx=e.x, sy=e.y-6, tx=target.x, ty=target.y, d=hyp(tx-sx,ty-sy)||1, spd=170;
  projs.push({x:sx, y:sy, vx:(tx-sx)/d*spd, vy:(ty-sy)/d*spd,
    side:e.side, siege:true, tx, ty, aoe:KINDS.catapult.aoe,
    dmgB:tstat(e.side,"catapult","dmgBuilding"), dmgT:tstat(e.side,"catapult","dmgTroop"),
    color:"#a5895f", life:d/spd+0.2, flight:d/spd, t0:0, arc:Math.min(34,d*0.14), pkind:"boulder"});
  parts.push({x:sx,y:sy,vx:0,vy:0,life:.1,t:0,size:3,color:PAL.flash,flash:true});
  sfx("shoot");
}

// ============================== FIREBALL SPELL ==============================
function launchSpells(){
  for(const s of spellsQueued){
    const k=KINDS[s.kind||"fireball"];
    if(k.instant){ castInstant(s); continue; }
    const tower=ents.find(e=>e.kind==="tower" && e.side===s.side);
    const x0=tower?tower.x:(facesRight(s.side)?CELL:W-CELL), y0=tower?tower.y-10:6.5*CELL;
    const d=hyp(s.x-x0,s.y-y0);
    fireballs.push({kind:s.kind||"fireball", side:s.side, x0,y0, tx:s.x, ty:s.y, t:0, dur:Math.max(.55, d/190)});
  }
  spellsQueued=[]; myMarkers=[];
  if(fireballs.length) sfx("shoot");
}
function castInstant(s){
  const k=KINDS[s.kind];
  if(s.kind==="heal"){
    // persistent healing zone (radius & HP/s frozen at cast from the caster's tech level)
    healZones.push({side:s.side, x:s.x, y:s.y, t:0, life:k.dur,
      r:tstat(s.side,"heal","radius"), hps:tstat(s.side,"heal","hps")});
    parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.22,t:0,size:13,color:"#b8ffc4",flash:true});
    for(let i=0;i<12;i++)
      parts.push({x:s.x+rnd(-10,10), y:s.y+rnd(-8,8), vx:rnd(-8,8), vy:rnd(-30,-10),
        life:rnd(.4,.8), t:0, size:rnd(1,2), color:Math.random()<.6?"#6ee77a":"#d9ffe0"});
    sfx("heal");
  }
  else if(s.kind==="shield"){
    const radius=tstat(s.side,"shield","radius");
    // grant absorb shields to EVERYTHING of yours in the bubble (tower included)
    parts.push({x:s.x,y:s.y,vx:0,vy:0,life:.3,t:0,size:radius*.7,color:"#bcd8ff",flash:true});
    for(let i=0;i<16;i++){
      const a=i/16*Math.PI*2;
      parts.push({x:s.x+Math.cos(a)*radius,y:s.y+Math.sin(a)*radius,
        vx:Math.cos(a)*8,vy:Math.sin(a)*8,life:rnd(.4,.7),t:0,size:rnd(1,2),color:"#7db4ff"});
    }
    sfx("heal");
    for(const e of ents){
      if(e.dead || e.side!==s.side) continue;
      if(hyp(e.x-s.x,e.y-s.y) <= radius+bodyR(e)){
        e.shield=(e.shield||0)+k.shield;
        floatText(e.x,e.y-12,"🛡","#7db4ff");
      }
    }
  }
}
function updateHealZones(dt){
  for(const z of healZones){
    z.t+=dt;
    const zr=z.r||KINDS.heal.radius, zhps=z.hps||KINDS.heal.hps;
    for(const e of ents){
      if(e.dead || e.side!==z.side) continue;
      if(!(e.troop || e.kind==="harvester" || e.kind==="wall")) continue;
      if(e.hp<e.maxHp && hyp(e.x-z.x,e.y-z.y)<=zr+bodyR(e))
        e.hp=Math.min(e.maxHp, e.hp+zhps*dt);
    }
    if(Math.random()<.25)
      parts.push({x:z.x+rnd(-zr,zr)*.8, y:z.y+rnd(-zr,zr)*.8,
        vx:0, vy:rnd(-18,-8), life:rnd(.4,.8), t:0, size:1, color:Math.random()<.6?"#6ee77a":"#d9ffe0"});
  }
  healZones=healZones.filter(z=>z.t<z.life);
}
function updateFires(dt){
  for(const f of fires){
    f.t+=dt;
    if(Math.random()<.35)
      parts.push({x:f.x+rnd(-5,5), y:f.y+rnd(-4,2), vx:rnd(-4,4), vy:rnd(-26,-10),
        life:rnd(.25,.6), t:0, size:rnd(1,2), color:Math.random()<.5?"#ff8c2e":(Math.random()<.5?"#ffd75e":"rgba(90,80,70,.5)")});
  }
  // burn: 1 HP per second while standing in ANY fire (overlapping fires don't stack)
  for(const e of ents){
    if(e.dead || !e.troop) continue;
    if(fires.some(f=>hyp(e.x-f.x,e.y-f.y)<=11)){
      e.burn=(e.burn||0)+dt;
      if(e.burn>=1){ e.burn-=1; damage(e,1,"#ff8c2e"); }
    } else e.burn=0;
  }
  fires=fires.filter(f=>f.t<f.life);
}
function updateMoneybags(){
  for(const b of moneybags){
    for(const e of ents){
      if(e.dead || !e.troop) continue;
      if(hyp(e.x-b.x,e.y-b.y)<=9){
        b.taken=true;
        golds[e.side]+=b.val;
        floatText(b.x,b.y-12,"+"+b.val+" 💰",PAL.gold);
        for(let i=0;i<8;i++) parts.push({x:b.x,y:b.y,vx:rnd(-40,40),vy:rnd(-60,-15),life:rnd(.4,.7),t:0,size:rnd(1,2),color:PAL.gold});
        sfx("coin");
        refreshUI();
        break;
      }
    }
  }
  moneybags=moneybags.filter(b=>!b.taken);
}
function spawnBag(rand){
  for(let tries=0;tries<60;tries++){
    const gx=Math.floor(rand()*COLS), gy=Math.floor(rand()*ROWS);
    if(NP===3 && TRI && !pointInTri(cellCx(gx),cellCx(gy),TRI)) continue;   // keep bags inside the triangle
    if(occupied(gx,gy)||blockedCell(gx,gy)||bagAt(gx,gy)) continue;
    moneybags.push({gx,gy,x:cellCx(gx),y:cellCx(gy),val:5+Math.floor(rand()*6)});
    return;
  }
}
function spellImpact(f){
  // stats honour the caster's fireball tech level
  const radius=tstat(f.side,"fireball","radius");
  const dmgT=tstat(f.side,"fireball","dmg"), dmgB=tstat(f.side,"fireball","dmgBuilding");
  // fireball detonation
  boom(f.tx,f.ty,"#ff9c40",26,true);
  for(let i=0;i<18;i++){                       // flame ring
    const a=i/18*Math.PI*2, s2=rnd(50,95);
    parts.push({x:f.tx,y:f.ty,vx:Math.cos(a)*s2,vy:Math.sin(a)*s2,life:rnd(.3,.55),t:0,
      size:rnd(1.5,3), color:Math.random()<.5?"#ff8c2e":"#ffd75e"});
  }
  scorches.push({x:f.tx,y:f.ty,t:0,life:7});
  // full damage to enemy troops, reduced vs buildings, minimal vs the tower
  for(const e of ents){
    if(e.dead || !foe(e.side,f.side)) continue;
    if(hyp(e.x-f.tx,e.y-f.ty) <= radius+bodyR(e)-3){
      const dmg = e.kind==="tower" ? KINDS.fireball.dmgTower : e.building ? dmgB : dmgT;
      damage(e, dmg, "#ff9c40");
    }
  }
  // trees in the blast burn down, leaving a fire that lasts 5-15s (seeded → same on both clients)
  for(const g of GROVES) for(const tr of g.trees){
    if(tr.dead) continue;
    if(hyp(tr.x-f.tx,tr.y-f.ty) <= radius+tr.r){
      tr.dead=true;
      fires.push({x:tr.x, y:tr.y, t:0, life:5+simRand()*10});
      for(let i=0;i<10;i++)                        // leaves scatter
        parts.push({x:tr.x,y:tr.y,vx:rnd(-50,50),vy:rnd(-60,-10),life:rnd(.4,.8),t:0,
          size:rnd(1,2),color:Math.random()<.5?"#2e4a26":"#40633a"});
    }
  }
}
function updateFireballs(dt){
  for(const f of fireballs){
    f.t+=dt;
    const p=Math.min(1,f.t/f.dur);
    const x=f.x0+(f.tx-f.x0)*p, y=f.y0+(f.ty-f.y0)*p;
    const arc=Math.sin(p*Math.PI)*46;
    f.x=x; f.y=y; f.arc=arc; f.p=p;
    // trail (cosmetic): embers+smoke for fireball, drifting sparkles for heal
    if(f.kind==="heal"){
      if(Math.random()<.8)
        parts.push({x:x+rnd(-2,2), y:y-arc+rnd(-2,2), vx:rnd(-6,6), vy:rnd(-4,10), life:rnd(.3,.6), t:0,
          size:rnd(1,2), color:Math.random()<.6?"#6ee77a":"#d9ffe0"});
    } else {
      for(let i=0;i<2;i++)
        parts.push({x:x+rnd(-2,2), y:y-arc+rnd(-2,2), vx:rnd(-14,14), vy:rnd(2,26), life:rnd(.2,.45), t:0,
          size:rnd(1,2.5), color:Math.random()<.55?"#ff8c2e":(Math.random()<.5?"#ffd75e":"#c94b1e")});
      if(Math.random()<.4)
        parts.push({x:x, y:y-arc-2, vx:rnd(-6,6), vy:rnd(-18,-6), life:rnd(.4,.8), t:0, size:2, color:"rgba(120,110,100,.5)"});
    }
    if(p>=1){ f.done=true; spellImpact(f); }
  }
  fireballs=fireballs.filter(f=>!f.done);
}

function rtEconomyTick(){
  turn++;
  golds.p+=income("p"); golds.b+=income("b");
  magics.p+=magicIncome("p"); magics.b+=magicIncome("b");
  for(const e of ents)
    if(e.kind==="harvester"||e.kind==="magicwell")
      e.harvested=(e.harvested||0)+tstat(e.side,e.kind,"inc");
  for(const e of ents) if(e.kind==="harvester") puff(e.x,e.y-4,PAL.gold,3);
  if(simRand()<0.5) spawnBag(simRand);
  floatText(mySide==="p"?40:W-40, 90, "+"+income(mySide)+" 💰", PAL.gold);
  sfx("coin");
  botBuild();
  launchSpells();                                 // bot's queued spells fire immediately in Blitz
  refreshUI();
}
function updateBattle(dt){
  battleT+=dt;
  if(RT){ rtT+=dt; if(rtT>=RT_TICK && !over){ rtT-=RT_TICK; rtEconomyTick(); } }
  updateFireballs(dt);
  updateHealZones(dt);
  updateFires(dt);
  updateMoneybags();
  for(const e of ents){
    if(e.dead) continue;
    if(e.burnT>0){                                 // burning (flaming arrows): 1 dmg/sec until it dies down
      e.burnT-=dt; e.burnAcc=(e.burnAcc||0)+dt;
      while(e.burnAcc>=1 && !e.dead){ damage(e,1,"#ff8c2e"); e.burnAcc-=1; }
      if(Math.random()<0.4) parts.push({x:e.x+rnd(-3,3),y:e.y-2,vx:rnd(-6,6),vy:rnd(-30,-14),life:rnd(.2,.4),t:0,size:rnd(1,2),color:Math.random()<.5?"#ff8c2e":"#ffd75e"});
      if(e.dead) continue;
    }
    e.cd=Math.max(0,e.cd-dt);

    if(e.troop){
      const k=KINDS[e.kind];
      const px0=e.x, py0=e.y;                     // for velocity tracking (shooters lead targets)
      e.slowT=Math.max(0,(e.slowT||0)-dt);
      const spd=tstat(e.side,e.kind,"spd")*(e.slowT>0?0.5:1);  // soaked troops move at half speed
      const range=tstat(e.side,e.kind,"range");
      const n=acquireTarget(e,k.aggro);           // only reacts inside its detection radius
      if(n){
        if(e.kind==="archer") e.aim=Math.atan2(n.t.y-e.y, n.t.x-e.x);   // face what it's shooting
        if(n.bag || n.d>range){                   // bags are walked to (picked up on contact), never attacked
          moveToward(e,n.t.x,n.t.y,spd,dt);        // steers left around ponds/groves in the way
          e.step+=dt*10;
          collideObstacles(e); collideBuildings(e);
          e.x=Math.max(4,Math.min(W-4,e.x)); e.y=Math.max(4,Math.min(H-4,e.y));
        } else if(e.cd<=0){
          e.cd=tstat(e.side,e.kind,"cd");
          const dmg=tstat(e.side,e.kind,"dmg");
          if(e.kind==="archer"){ const arm=modArmed(e.side,"archer");   // Flaming Arrows modifier: fiery arrow that ignites the target
            shoot(e,n.t,{dmg, color:arm?"#ff8c2e":teamCol(e.side), spd:150, burn:arm?MODIFIERS.archer.burn:0}); }
          else {
            damage(n.t,dmg, teamCol(e.side));
            puff(n.t.x,n.t.y,PAL.white,3);
          }
        }
      } else {
        // nothing detected: head for an enemy tower
        let tx, ty;
        if(NP===3){                                    // triangle FFA: head for the nearest enemy tower
          const tw = nearestEnemyTower(e);
          tx = tw?tw.x:e.x; ty = tw?tw.y:e.y;
        } else {                                        // 1v1 & 2v2: march straight forward, home in near the towers' column
          const tower=NP===4 ? nearestEnemyTower(e)
                             : ents.find(o=>o.kind==="tower" && foe(o.side,e.side) && !o.dead);
          tx=e.x+(facesRight(e.side)?100:-100); ty=e.y;
          if(tower && Math.abs(tower.x-e.x)<70){ tx=tower.x; ty=tower.y; }
        }
        if(e.kind==="archer") e.aim=Math.atan2(ty-e.y, tx-e.x);         // face the march direction
        moveToward(e,tx,ty,spd,dt);                // steers left around ponds/groves in the way
        e.step+=dt*10;
        collideObstacles(e); collideBuildings(e);
        e.x=Math.max(4,Math.min(W-4,e.x)); e.y=Math.max(4,Math.min(H-4,e.y));
      }
      // record velocity so towers/turrets/archers can lead their shots
      e.vx=(e.x-px0)/dt; e.vy=(e.y-py0)/dt;
    }
    else if(e.kind==="turret"){
      const range=tstat(e.side,"turret","range"), n=nearestEnemy(e,true);
      if(n && n.d<=range){
        e.aim=Math.atan2(n.t.y-e.y,n.t.x-e.x);
        // splash damage: cannonball explodes on impact, hitting everything in the blast radius
        if(e.cd<=0){
          e.cd=tstat(e.side,"turret","cd");
          shoot(e,n.t,{dmg:tstat(e.side,"turret","dmg"),aoe:KINDS.turret.aoe,color:"#ffb347",spd:110,size:2.5,lift:5,pkind:"ball"});
        }
      }
    }
    else if(e.kind==="catapult"){
      const n=nearestEnemyBuilding(e, KINDS.catapult.range);   // sieges enemy buildings anywhere on the map
      if(n){
        e.aim=Math.atan2(n.t.y-e.y,n.t.x-e.x);
        if(e.cd<=0){ e.cd=tstat(e.side,"catapult","cd"); lobBoulder(e,n.t); }
      }
    }
    else if(e.kind==="duck"){
      const k=KINDS.duck, n=nearestEnemy(e,true);
      if(n && n.d<=k.range){
        e.aim=Math.atan2(n.t.y-e.y,n.t.x-e.x);
        if(e.cd<=0){
          e.cd=tstat(e.side,"duck","cd");
          shoot(e,n.t,{dmg:KINDS.duck.dmg,slow:tstat(e.side,"duck","slow"),color:SCENE.proj.color,spd:170,pkind:"water"});
        }
      }
    }
    else if(e.kind==="spikes"){
      // single-use trap: erupts when an enemy troop steps into the blast, hitting every foe inside
      const rad=tstat(e.side,"spikes","rad");
      let armed=false;
      for(const o of ents){ if(!o.dead && o.troop && foe(o.side,e.side) && dist(e,o)<=rad){ armed=true; break; } }
      if(armed){
        const dmg=tstat(e.side,"spikes","dmg"), col=teamCol(e.side);
        for(const o of ents) if(!o.dead && o.troop && foe(o.side,e.side) && dist(e,o)<=rad) damage(o,dmg,col);
        floatText(e.x,e.y-10,"SPIKES!",col);
        spikePop(e.x,e.y,col);
        e.dead=true;
      }
    }
    else if(e.kind==="tower"){
      const L=TOWER_LEVELS[e.level||1];
      if(e.cd<=0){
        // multi-targeting: each volley fires at up to 3 nearest enemy troops in range
        const targets=ents.filter(o=>o.troop && !o.dead && foe(o.side,e.side) && dist(e,o)<=L.range)
          .sort((a,b)=>dist(e,a)-dist(e,b)).slice(0,3);
        if(targets.length){
          e.cd=L.cd;
          for(const t of targets)
            shoot(e,t,{dmg:L.dmg,color:teamCol(e.side),spd:140,lift:14});
        }
      }
    }
  }

  // projectiles
  for(const p of projs){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.siege){                                   // catapult boulder: arcs over troops, detonates on its target tile
      p.t0+=dt;
      if(hyp(p.x-p.tx,p.y-p.ty)<7 || p.life<=0){
        p.life=0;
        boom(p.tx,p.ty,"#a5895f",16,true);
        for(const o of ents){
          if(o.dead||!foe(o.side,p.side)) continue;
          if(hyp(o.x-p.tx,o.y-p.ty)<=p.aoe) damage(o, o.building?p.dmgB:p.dmgT, teamCol(p.side));
        }
      }
      continue;
    }
    if(Math.random()<.5) parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.15,t:0,size:1,color:p.color});
    let hit=null;
    for(const e of ents){
      if(e.dead || !foe(e.side,p.side)) continue;
      const r = e.building ? 8 : 6.5;
      if(Math.abs(e.x-p.x)<r && Math.abs(e.y-p.y)<r){ hit=e; break; }
    }
    if(hit){
      p.life=0;
      if(p.slow){                                  // duck water: SPLASHES — soaks every enemy troop nearby
        let soaked=0;
        for(const o of ents){
          if(o.dead || !foe(o.side,p.side) || !o.troop) continue;
          if(hyp(o.x-p.x,o.y-p.y)<=16){
            o.slowT=Math.max(o.slowT||0,p.slow);
            if(p.dmg>0) damage(o,p.dmg,SCENE.proj.color);
            soaked++;
          }
        }
        if(soaked) floatText(p.x,p.y-10,SCENE.splash,SCENE.proj.color);
        for(let i=0;i<8;i++) parts.push({x:p.x,y:p.y,vx:rnd(-35,35),vy:rnd(-45,-5),life:rnd(.2,.45),t:0,size:rnd(1,2),color:SCENE.proj.color});
      }
      else if(p.aoe){
        boom(p.x,p.y,PAL.gold,12);
        for(const e of ents){
          if(e.dead||!foe(e.side,p.side)) continue;
          if(dist(e,p)<=p.aoe) damage(e,p.dmg, teamCol(p.side));
        }
      } else {
        damage(hit,p.dmg, teamCol(p.side));
        puff(p.x,p.y,p.color,4);
        if(p.burn && !hit.dead){ hit.burnT=Math.max(hit.burnT||0, p.burn); hit.burnBy=p.side; }   // flaming arrow ignites
      }
    }
    if(p.x<-8||p.x>W+8||p.y<-8||p.y>H+8) p.life=0;
  }
  projs=projs.filter(p=>p.life>0);
  ents=ents.filter(e=>!e.dead);

  if(!RT && !over && fireballs.length===0 && (battleT>BATTLE_MAX || !anyTroopsAlive())) endBattle();
}

function endBattle(){
  phase="build"; turn++;
  for(const s of SIDES) activeMods[s]={};          // one-time modifiers are spent after the turn
  const incMe=income(mySide);
  for(const s of SIDES){ golds[s]+=income(s); magics[s]+=magicIncome(s); }
  // shield bubbles wear off at the end of the turn
  for(const e of ents) e.shield=0;
  for(const e of ents) if(e.kind==="magicwell") puff(e.x,e.y-4,"#c9a0ff",4);
  // harvesters & mana wells remember lifetime earnings (killers collect a 25% bounty)
  for(const e of ents)
    if(e.kind==="harvester"||e.kind==="magicwell")
      e.harvested=(e.harvested||0)+tstat(e.side,e.kind,"inc");
  if(simRand()<0.5) spawnBag(simRand);            // 50% chance a fresh money bag appears
  upgradeQueued=false;
  floatText(mySide==="p"?40:W-40, 90, "+"+incMe+" 💰", PAL.gold);
  sfx("coin");
  for(const e of ents) if(e.kind==="harvester") puff(e.x,e.y-4,PAL.gold,4);
  // desync check: both clients compute the shared public state; host compares (2-player only)
  if(mode==="online" && netN===2){
    const rep={pG:golds.p, bG:golds.b, pHp:towerHp("p"), bHp:towerHp("b"), n:ents.length, turn,
      pLv:(towerOf("p")||{level:1}).level, bLv:(towerOf("b")||{level:1}).level, bags:moneybags.length,
      tp:techs.p, tb:techs.b, pM:magics.p, bM:magics.b};
    if(isHost){ myReport=rep; checkReports(); }
    else sendMsg({type:"report", rep});
  }
  if(!over) allyBuild();                            // 2v2: teammate builds now, visible during your build phase
  refreshUI();
}
function towerHp(side){ const t=ents.find(e=>e.kind==="tower"&&e.side===side); return t?t.hp:0; }

function startBattle(){
  if(RT||phase!=="build"||over||menuOpen) return;
  if(mode==="online"){
    if(waitingOrders) return;
    if(isHost){ if(netN===3 ? guests.length<2 : !conn) return; }
    else if(!conn) return;
    waitingOrders=true; selected=null;
    if(isHost){ myCommitted=true; if(netN===3) tryResolveP2P3(); else tryResolveP2P(); }
    else sendMsg({type:"orders", orders:myOrders});
    refreshUI();
    return;                       // battle starts when all players have committed
  }
  selected=null;
  if(NP===4){ for(const s of SIDES) if(foe(s,mySide)) botBuild3(s); }  // 2v2: enemies build now; teammates already built at build-phase start
  else if(NP>=3){ for(const s of SIDES) if(s!==mySide) botBuild3(s); }
  else botBuild();
  launchSpells();
  phase="battle"; battleT=0;
  refreshUI();
}

// both players' orders are in → apply canonically and run the battle
function resolveOrders(data){
  waitingOrders=false; selected=null;
  ents=ents.filter(e=>!e.pending);              // replace my optimistic placements
  golds[mySide]+=costOfSide(mySide,myOrders);   // refund both currencies, deduct canonically below
  magics[mySide]+=costMagicOf(myOrders);
  myOrders=[]; upgradeQueued=false; pendingTech={};
  for(const s of SIDES) activeMods[s]={};         // rebuild armed modifiers canonically from the orders below
  // every client tracks all sides' gold & magic, so each can verify nobody overspent
  for(const side of SIDES){
    const troopOrders=(data[side]||[]).filter(o=>KINDS[o.kind]&&KINDS[o.kind].troop).length;
    if(costOfSide(side,data[side]||[]) > golds[side]+1e-6 ||
       costMagicOf(data[side]||[]) > magics[side]+1e-6 ||
       troopCount(side)+troopOrders > TROOP_LIMIT){
      showBanner("⚠️ Invalid orders detected — game ended","var(--accent)");
      return;
    }
  }
  for(const side of SIDES)                       // fixed order = identical ents array on every client
    for(const o of (data[side]||[])){
      if(o.kind==="upgrade"){
        const t=towerOf(side);
        if(t && t.level<4){ golds[side]-=TOWER_LEVELS[t.level+1].cost; applyUpgrade(side); }
        continue;
      }
      if(o.kind==="tech"){
        const cur=techLvl(side,o.card);
        if(TECH[o.card] && cur<4){ golds[side]-=TECH[o.card][cur+1].cost; applyTech(side,o.card); }
        continue;
      }
      if(o.kind==="mod"){
        if(MODIFIERS[o.card]){ golds[side]-=MODIFIERS[o.card].cost; activeMods[side]=activeMods[side]||{}; activeMods[side][o.card]=true; }
        continue;
      }
      if(o.kind==="sell"){
        const e=ents.find(t=>!t.dead && t.side===side && t.building && t.kind!=="tower" &&
          t.gx===o.gx && t.gy===o.gy);
        if(e){
          golds[side]+=Math.floor(KINDS[e.kind].cost*SELL_RATE);
          e.dead=true;
          puff(e.x,e.y,PAL.gold,6);
        }
        continue;
      }
      if(!KINDS[o.kind]) continue;
      if(KINDS[o.kind].spell){
        if(o.gx>=0&&o.gx<COLS&&o.gy>=0&&o.gy<ROWS){
          magics[side]-=KINDS[o.kind].cost;
          spellsQueued.push({side, x:cellCx(o.gx), y:cellCx(o.gy), kind:o.kind});
        }
      }
      else if(validSpot(side,o.gx,o.gy,o.kind)){
        golds[side]-=KINDS[o.kind].cost;
        spawn(side,o.kind,o.gx,o.gy);
        puff(cellCx(o.gx),cellCx(o.gy), teamCol(side), 8);
      }
    }
  ents=ents.filter(e=>!e.dead);                 // sold buildings leave the field
  launchSpells();
  phase="battle"; battleT=0;
  refreshUI();
}

  if(!SIDES.includes(side)) return;
  SIDES=SIDES.filter(s=>s!==side);

// deciduous canopy from above: lumpy circular crown, light pooled toward the centre
function drawLeafyTop(t){
  const P=TREE_PAL[t.variant], x=t.x, y=t.y;
  const r=(t.variant===1?t.r*1.15:t.variant===3?t.r*0.9:t.r);
  const sway=Math.sin(animT*1.4+t.seed*9)*0.4, lobes=6;
  ctx.fillStyle="rgba(0,0,0,.20)"; ctx.beginPath(); ctx.arc(x+1.5,y+2,r,0,7); ctx.fill();   // ground shadow
  ctx.fillStyle=P.shadow;                                                                    // dark outer crown
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  for(let i=0;i<lobes;i++){ const a=i/lobes*6.283+t.seed;
    ctx.beginPath(); ctx.arc(x+Math.cos(a)*r*0.66,y+Math.sin(a)*r*0.66,r*0.44,0,7); ctx.fill(); }  // rim lumps
  ctx.fillStyle=P.body;                                                                      // mid tone
  ctx.beginPath(); ctx.arc(x+sway,y,r*0.78,0,7); ctx.fill();
  for(let i=0;i<lobes;i++){ const a=i/lobes*6.283+t.seed+0.6;
    ctx.beginPath(); ctx.arc(x+Math.cos(a)*r*0.46,y+Math.sin(a)*r*0.46,r*0.3,0,7); ctx.fill(); }
  ctx.fillStyle=P.hi;                                                                        // top-lit centre
  ctx.beginPath(); ctx.arc(x-r*0.1+sway,y-r*0.1,r*0.42,0,7); ctx.fill();
  px(x-1,y-1,1,1,P.hi);
}
// conifer from above: a spiky green star, needles radiating outward
function drawPine(t){
  const x=t.x, y=t.y, r=t.r, spin=Math.sin(animT*1.2+t.seed*9)*0.1, rot=t.seed*6.283, spikes=9;
  ctx.fillStyle="rgba(0,0,0,.20)"; ctx.beginPath(); ctx.arc(x+1.5,y+2,r*0.95,0,7); ctx.fill();
  const star=(r1,r2,col,off)=>{
    ctx.fillStyle=col; ctx.beginPath();
    for(let i=0;i<spikes*2;i++){ const a=rot+off+spin+i/(spikes*2)*6.283, rad=i%2?r2:r1;
      const vx=x+Math.cos(a)*rad, vy=y+Math.sin(a)*rad; i===0?ctx.moveTo(vx,vy):ctx.lineTo(vx,vy); }
    ctx.closePath(); ctx.fill();
  };
  star(r,      r*0.5,  "#1e3a28", 0);      // dark outer needles
  star(r*0.78, r*0.42, "#265030", 0.16);
  star(r*0.52, r*0.28, "#2f6238", 0.32);   // lighter inner
  px(x-0.5,y-0.5,1.5,1.5,"#3a6b42");        // trunk core

}
// palm from above: fronds splayed out like a pinwheel from a central trunk
function drawPalm(t){
  const x=t.x, y=t.y, r=t.r, sway=Math.sin(animT*1.3+t.seed*7)*0.12, fronds=7;
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.arc(x+1.5,y+2,r*0.9,0,7); ctx.fill();
  for(let i=0;i<fronds;i++){
    const a=i/fronds*6.283 + t.seed + sway;
    const mx=x+Math.cos(a)*r*0.6, my=y+Math.sin(a)*r*0.6;         // arch control point
    const ex=x+Math.cos(a)*r*1.2, ey=y+Math.sin(a)*r*1.2;
    const perp=a+Math.PI/2, bow=r*0.18;                          // slight curl to each frond
    ctx.strokeStyle="#2f7a3a"; ctx.lineWidth=2.6; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.quadraticCurveTo(mx+Math.cos(perp)*bow, my+Math.sin(perp)*bow, ex, ey); ctx.stroke();
    ctx.strokeStyle="#43a24d"; ctx.lineWidth=1;                  // frond midrib highlight
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.quadraticCurveTo(mx+Math.cos(perp)*bow, my+Math.sin(perp)*bow, ex, ey); ctx.stroke();
  }
  ctx.fillStyle="#5a3f28"; ctx.beginPath(); ctx.arc(x,y,1.9,0,7); ctx.fill();   // trunk hub
  px(x,y-1,1,1,"#8a6a3f"); px(x-1,y,1,1,"#4a3320");                              // coconuts
