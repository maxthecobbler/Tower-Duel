// ============================== OBSTACLES (random each game, mirrored for fairness) ==============================
let PONDS=[], GROVES=[], OBS_CIRCLES=[];

// 3 pond shape variants: 0 round-ish puddle, 1 long lake, 2 kidney/bean
function makePond(x,y,variant){
  const base = variant===0 ? {rx:19,ry:16} : variant===1 ? {rx:31,ry:13} : {rx:25,ry:16};
  const pts=[], N=14, phase=rnd(0,Math.PI*2);
  const lumps=[]; for(let i=0;i<N;i++) lumps.push(rnd(.82,1.18));   // organic bumps
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    let rx=base.rx*lumps[i], ry=base.ry*lumps[(i+3)%N];
    if(variant===2){                                                // dent one side → kidney
      const dent=Math.max(0,Math.cos(a-phase));
      rx*=1-.38*dent*dent; ry*=1-.38*dent*dent;
    }
    pts.push({x:x+Math.cos(a)*rx, y:y+Math.sin(a)*ry});
  }
  const maxR=Math.max(base.rx,base.ry)*1.18;
  // precomputed shore details so the pond blends into the grass
  const deco={wet:[],pebbles:[],reeds:[],lilies:[]};
  for(let i=0;i<N;i++){
    const dx=pts[i].x-x, dy=pts[i].y-y;
    for(let j=0;j<3;j++){                                  // damp grass speckle outside the bank
      const f=rnd(1.12,1.55);
      deco.wet.push({x:x+dx*f, y:y+dy*f, s:Math.random()<.35?2:1,
        c:Math.random()<.5?"#2c4430":"#263b2c"});
    }
    if(Math.random()<.4) deco.pebbles.push({x:x+dx*rnd(1.0,1.1), y:y+dy*rnd(1.0,1.1)});
    if(Math.random()<.35) deco.reeds.push({x:x+dx*.97, y:y+dy*.97, h:3+Math.random()*3});
  }
  for(let i=0;i<2+Math.floor(Math.random()*2);i++)         // lily pads
    deco.lilies.push({x:x+rnd(-.45,.45)*base.rx, y:y+rnd(-.45,.45)*base.ry, r:2+Math.random()*1.5, a:rnd(0,6)});
  return {x,y,variant,pts,rx:base.rx*1.18,ry:base.ry*1.18,maxR,shimSeed:rnd(0,9),deco};
}
function makeGrove(x,y,rand){
  const trees=[]; const n=3+Math.floor(rand()*2);                   // 3-4 trees (fuel for fireballs)
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+rand();
    trees.push({x:x+Math.cos(a)*rnd(4,8), y:y+Math.sin(a)*rnd(3,7),
      r:5.5+rand()*3, variant:Math.floor(rand()*4), seed:rand()});
  }
  return {x,y,trees};
}

// 3-player: obstacles live INSIDE the triangle, placed in 3-fold-symmetric trios (fair for all corners)
function genObstacles3(rand){
  const rr=(a,b)=>a+rand()*(b-a);
  PONDS=[]; GROVES=[]; OBS_CIRCLES=[];
  const mid=TRI.mid;
  const rot=(x,y,k)=>{ const a=k*2*Math.PI/3, c=Math.cos(a), s=Math.sin(a);
    return {x:mid.x+(x-mid.x)*c-(y-mid.y)*s, y:mid.y+(x-mid.x)*s+(y-mid.y)*c}; };
  const towers=["p","b","c"].map(sd=>{ const dx=mid.x-TRI[sd].x, dy=mid.y-TRI[sd].y, m=hyp(dx,dy)||1;
    return {x:TRI[sd].x+dx/m*CELL*3, y:TRI[sd].y+dy/m*CELL*3}; });
  const fits=(x,y,r)=> pointInTri(x,y,TRI)&&pointInTri(x+r,y,TRI)&&pointInTri(x-r,y,TRI)&&pointInTri(x,y+r,TRI)&&pointInTri(x,y-r,TRI);
  const clearOf=(x,y,r)=>{
    for(const t of towers) if(hyp(x-t.x,y-t.y)<r+46) return false;
    for(const p of PONDS)  if(hyp(x-p.x,y-p.y)<r+p.maxR+12) return false;
    for(const g of GROVES) if(hyp(x-g.x,y-g.y)<r+28) return false;
    return true;
  };
  const placeTrio=(r,make)=>{
    for(let tries=0;tries<160;tries++){
      const x=rr(mid.x-W*0.34,mid.x+W*0.34), y=rr(mid.y-H*0.34,mid.y+H*0.34);
      const pts=[{x,y},rot(x,y,1),rot(x,y,2)];
      if(pts.every(p=>fits(p.x,p.y,r)&&clearOf(p.x,p.y,r))){ for(const p of pts) make(p.x,p.y); return; }
    }
  };
  { const v=Math.floor(rand()*3); placeTrio(30,(x,y)=>PONDS.push(makePond(x,y,v))); }       // blue pond trio
  placeTrio(24,(x,y)=>{ const p=makePond(x,y,0); p.magic=true; PONDS.push(p); });           // magic pond trio
  placeTrio(22,(x,y)=>GROVES.push(makeGrove(x,y,rand)));                                     // grove trio
  placeTrio(22,(x,y)=>GROVES.push(makeGrove(x,y,rand)));                                     // grove trio
  for(const p of PONDS){
    if(p.variant===1){ OBS_CIRCLES.push({x:p.x-14,y:p.y,r:14},{x:p.x,y:p.y,r:15},{x:p.x+14,y:p.y,r:14}); }
    else { OBS_CIRCLES.push({x:p.x-8,y:p.y,r:15},{x:p.x+8,y:p.y,r:15}); }
  }
  for(const g of GROVES) OBS_CIRCLES.push({x:g.x,y:g.y,r:13,g});
}
function genObstacles(rand){
  // rand MUST be the seeded generator online — obstacle positions are gameplay
  rand = rand || Math.random;
  if(NP===3 && TRI){ genObstacles3(rand); return; }
  const rr=(a,b)=>a+rand()*(b-a);
  PONDS=[]; GROVES=[]; OBS_CIRCLES=[];
  const t1={x:CELL,y:6.5*CELL}, t2={x:(COLS-1)*CELL,y:6.5*CELL};
  const clearOf=(x,y,r)=>{
    if(hyp(x-t1.x,y-t1.y)<r+42 || hyp(x-t2.x,y-t2.y)<r+42) return false;
    for(const p of PONDS)  if(hyp(x-p.x,y-p.y)<r+p.maxR+12) return false;
    for(const g of GROVES) if(hyp(x-g.x,y-g.y)<r+30) return false;
    return true;
  };
  // one mirrored blue pond pair
  for(let tries=0;tries<80 && PONDS.length<2;tries++){
    const x=rr(3.2*CELL,11.5*CELL), y=rr(1.8*CELL,(ROWS-1.8)*CELL);
    if(!clearOf(x,y,34) || !clearOf(W-x,H-y,34)) continue;
    const v=Math.floor(rand()*3);
    PONDS.push(makePond(x,y,v), makePond(W-x,H-y,v));
  }
  // one mirrored PURPLE magic pond pair (small round variant — mana wells go here)
  for(let tries=0;tries<80 && PONDS.length<4;tries++){
    const x=rr(2.8*CELL,12*CELL), y=rr(1.6*CELL,(ROWS-1.6)*CELL);
    if(!clearOf(x,y,30) || !clearOf(W-x,H-y,30)) continue;
    const a=makePond(x,y,0), b=makePond(W-x,H-y,0);
    a.magic=b.magic=true;
    PONDS.push(a,b);
  }
  // three mirrored grove pairs
  for(let pair=0;pair<3;pair++){
    for(let tries=0;tries<80;tries++){
      const x=rr(2.5*CELL,12.8*CELL), y=rr(1.2*CELL,(ROWS-1.2)*CELL);
      if(!clearOf(x,y,22) || !clearOf(W-x,H-y,22)) continue;
      GROVES.push(makeGrove(x,y,rand), makeGrove(W-x,H-y,rand));
      break;
    }
  }
  // collision circles troops get pushed out of
  for(const p of PONDS){
    if(p.variant===1){ OBS_CIRCLES.push({x:p.x-14,y:p.y,r:14},{x:p.x,y:p.y,r:15},{x:p.x+14,y:p.y,r:14}); }
    else { OBS_CIRCLES.push({x:p.x-8,y:p.y,r:15},{x:p.x+8,y:p.y,r:15}); }
  }
  for(const g of GROVES) OBS_CIRCLES.push({x:g.x,y:g.y,r:13,g});
}

function pondAt(gx,gy){
  const cx=cellCx(gx), cy=cellCx(gy);
  for(const p of PONDS){
    if(((cx-p.x)/(p.rx+4))**2 + ((cy-p.y)/(p.ry+4))**2 < 1) return p;
  }
  return null;
}
function pondCell(gx,gy){ return !!pondAt(gx,gy); }
function groveAlive(g){ return g.trees.some(t=>!t.dead); }
function blockedCell(gx,gy){
  if(pondCell(gx,gy)) return true;
  const cx=cellCx(gx), cy=cellCx(gy);
  for(const g of GROVES){
    if(groveAlive(g) && hyp(cx-g.x,cy-g.y) < 17) return true;
  }
  return false;
}
function collideObstacles(e){
  for(const o of OBS_CIRCLES){
    if(o.g && !groveAlive(o.g)) continue;          // burned-down groves stop blocking
    const dx=e.x-o.x, dy=e.y-o.y, d=hyp(dx,dy);
    if(d<o.r && d>0.001){ e.x=o.x+dx/d*o.r; e.y=o.y+dy/d*o.r; }
  }
}
// is the point `probe` ahead of e (heading `ang`) clear of every obstacle?
function dirClear(e,ang,probe){
  const nx=e.x+Math.cos(ang)*probe, ny=e.y+Math.sin(ang)*probe;
  for(const o of OBS_CIRCLES){
    if(o.g && !groveAlive(o.g)) continue;
    if(hyp(nx-o.x,ny-o.y) < o.r + bodyR(e) + 1) return false;
  }
  return true;
}
// walk toward (tx,ty); if a pond/grove blocks the way, veer around the side the troop is already closer to
function moveToward(e,tx,ty,spd,dt){
  const base=Math.atan2(ty-e.y,tx-e.x), probe=12;
  let ang=base;
  if(!dirClear(e,base,probe)){
    const ux=Math.cos(base), uy=Math.sin(base);
    // find the nearest blocking obstacle ahead, then pick the shorter way around (the side the troop is offset toward)
    let blocker=null, bd=1e9;
    for(const o of OBS_CIRCLES){
      if(o.g && !groveAlive(o.g)) continue;
      const d=hyp(e.x+ux*probe-o.x, e.y+uy*probe-o.y);
      if(d < o.r+bodyR(e)+1 && d<bd){ bd=d; blocker=o; }
    }
    let dir=-1;                                     // default: veer left
    if(blocker){
      const leftness = uy*(e.x-blocker.x) - ux*(e.y-blocker.y);  // >0 = troop is on the LEFT of the obstacle
      dir = leftness>0 ? -1 : 1;                    // on the left → go left; on the right → go right
    }
    for(let i=1;i<=9;i++){                          // sweep the chosen direction in 18° steps (up to ~160°)
      const a=base + dir*i*(Math.PI/10);
      if(dirClear(e,a,probe)){ ang=a; break; }
      ang=a;
    }
  }
  e.x+=Math.cos(ang)*spd*dt;
  e.y+=Math.sin(ang)*spd*dt;
}

function tracePond(p,scale,dy){
  ctx.beginPath();
  for(let i=0;i<p.pts.length;i++){
    const vx=p.x+(p.pts[i].x-p.x)*scale, vy=p.y+(p.pts[i].y-p.y)*scale+(dy||0);
    i===0 ? ctx.moveTo(vx,vy) : ctx.lineTo(vx,vy);
  }
  ctx.closePath();
}
function drawPond(p){
  if(SCENE.obstacle==="rockpile"){ drawRockPile(p); return; }
  if(SCENE.obstacle==="sandcastle"){ drawSandCastle(p); return; }
  // --- transition into the grass: soft damp-green rings, no hard edge ---
  ctx.fillStyle="rgba(44,68,48,0.30)"; tracePond(p,1.42,0); ctx.fill();
  ctx.fillStyle="rgba(38,59,44,0.45)"; tracePond(p,1.24,0); ctx.fill();
  for(const w of p.deco.wet) px(w.x,w.y,w.s,1,w.c);            // damp grass speckle
  // --- mud bank ring ---
  ctx.fillStyle=p.magic?"#4a3a56":"#57482f"; tracePond(p,1.12,0); ctx.fill();
  ctx.fillStyle=p.magic?"#3c2f47":"#493c28"; tracePond(p,1.04,0); ctx.fill();
  // --- top-down water: lighter shallows at shore, darkest in the middle ---
  ctx.fillStyle=p.magic?"#7a4fae":"#3d7292"; tracePond(p,1,0);   ctx.fill();
  ctx.fillStyle=p.magic?"#5e3a85":"#2e5c79"; tracePond(p,.72,0); ctx.fill();
  ctx.fillStyle=p.magic?"#43265f":"#224a61"; tracePond(p,.42,0); ctx.fill();
  // magic ponds exhale drifting sparkle motes
  if(p.magic && Math.random()<.15)
    parts.push({x:p.x+rnd(-p.rx,p.rx)*.6, y:p.y+rnd(-p.ry,p.ry)*.6, vx:rnd(-3,3), vy:rnd(-14,-6),
      life:rnd(.6,1.2), t:0, size:1, color:Math.random()<.5?"#c9a0ff":"#e8d6ff"});
  // animated shimmer
  ctx.fillStyle=p.magic?"#c9a0ff":"#7fc4de";
  for(let i=0;i<4;i++){
    const a=animT*1.2+i*1.7+p.shimSeed;
    const sx=p.x+Math.cos(a)*p.rx*.4, sy=p.y+Math.sin(a*1.3)*p.ry*.38;
    ctx.fillRect(Math.round(sx),Math.round(sy),3,1);
  }
  if(p.magic){
    // arcane spots swirling in the water (no lily pads here)
    for(const l of p.deco.lilies){
      const bx=l.x+Math.sin(animT*.6+l.a)*1, by=l.y+Math.cos(animT*.5+l.a)*0.8;
      ctx.globalAlpha=.7+Math.sin(animT*2+l.a)*.25;
      ctx.fillStyle="#8a5fc4"; ctx.beginPath(); ctx.arc(bx,by,l.r,0,7); ctx.fill();
      ctx.fillStyle="#b38ae0"; ctx.beginPath(); ctx.arc(bx,by,l.r*.5,0,7); ctx.fill();
      px(bx,by-1,1,1,"#e8d6ff");
      ctx.globalAlpha=1;
    }
    // extra faint spots deeper in the water
    for(let i=0;i<3;i++){
      const a2=p.shimSeed+i*2.1;
      const sx=p.x+Math.cos(a2)*p.rx*.35, sy=p.y+Math.sin(a2*1.4)*p.ry*.35;
      ctx.globalAlpha=.35; ctx.fillStyle="#9b6fd4";
      ctx.beginPath(); ctx.arc(sx,sy,1.6,0,7); ctx.fill();
      ctx.globalAlpha=1;
    }
  } else {
    // lily pads drifting slightly (blue ponds only)
    for(const l of p.deco.lilies){
      const bx=l.x+Math.sin(animT*.6+l.a)*1;
      ctx.fillStyle="#3f6b38"; ctx.beginPath(); ctx.arc(bx,l.y,l.r,0,7); ctx.fill();
      ctx.fillStyle="#2e5229"; px(bx,l.y,l.r,1,"#2e5229");       // pad notch
      px(bx-1,l.y-1,1,1,"#548a4b");
    }
  }
  // shore pebbles + reeds around the rim (violet reeds on magic ponds)
  for(const s of p.deco.pebbles){ px(s.x,s.y,2,1,"#8a8271"); px(s.x,s.y,1,1,"#a09883"); }
  for(const r of p.deco.reeds){
    const sway=Math.sin(animT*2+r.x)*0.7;
    if(p.magic){ px(r.x,r.y-r.h,1,r.h,"#5e4a7a"); px(r.x+sway,r.y-r.h-1,1,2,"#9b7fc4"); }
    else { px(r.x,r.y-r.h,1,r.h,"#2f4630"); px(r.x+sway,r.y-r.h-1,1,2,"#4a6b35"); }
  }
}
// Mountains: the pond footprint becomes a pile of boulders (magic pond → purple crystal rocks).
// a deterministic scatter of boulders filling the pond footprint (cached per pond, stable each frame)
function rockScatter(p){
  if(p._rocks) return p._rocks;
  let s=((p.shimSeed*99991)>>>0) || 12345;
  const rr=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const n=11+Math.floor(rr()*6), arr=[];                                            // ~11-16 rocks
  for(let i=0;i<n;i++){
    const a=rr()*Math.PI*2, rad=Math.sqrt(rr())*0.9;                                // even fill of the disk
    arr.push({x:p.x+Math.cos(a)*p.rx*rad, y:p.y+Math.sin(a)*p.ry*rad, r:1.5+rr()*2.8, big:rr()<0.35});
  }
  arr.sort((a,b)=>a.y-b.y);                                                          // back-to-front
  return (p._rocks=arr);
}
// Mountains: the pond footprint becomes a heaped pile of boulders (magic pond → purple crystal rocks).
function drawRockPile(p){
  ctx.fillStyle=p.magic?"rgba(58,47,71,.45)":"rgba(60,53,45,.45)"; tracePond(p,1.28,0); ctx.fill();
  ctx.fillStyle=p.magic?"#3a2f47":"#463f36"; tracePond(p,1.06,0); ctx.fill();       // dirt base
  for(const b of rockScatter(p)){
    const R=b.r;
    ctx.fillStyle=p.magic?"#2a2038":"#3a352d";                                       // dark contact shadow
    ctx.beginPath(); ctx.ellipse(b.x,b.y+R*0.5,R*1.05,R*0.5,0,0,7); ctx.fill();
    ctx.fillStyle=p.magic?"#4a3a66":"#6b6358";                                       // rock body
    ctx.beginPath(); ctx.arc(b.x,b.y,R,0,7); ctx.fill();
    ctx.fillStyle=p.magic?"#5e4a82":"#847c6d";                                       // top-left highlight
    ctx.beginPath(); ctx.arc(b.x-R*0.28,b.y-R*0.3,R*0.6,0,7); ctx.fill();
    px(b.x-R*0.2,b.y-R*0.45,1,1, p.magic?"#b79ce0":"#9c9384");                        // spec dot
    if(p.magic && b.big){                                                            // glowing crystal shard on big rocks
      const cs=Math.sin(animT*2+b.x)*0.5;
      px(b.x-1,b.y-R-2.5+cs,2,4,"#c9a0ff"); px(b.x,b.y-R-1.5+cs,1,2,"#f0e4ff");
    }
  }
  for(const s of p.deco.pebbles){ px(s.x,s.y,2,2, p.magic?"#5a4a75":"#7a7264"); px(s.x,s.y,1,1, p.magic?"#7a63a0":"#948b7b"); }
  if(p.magic && Math.random()<.15)
    parts.push({x:p.x+rnd(-p.rx,p.rx)*.5,y:p.y,vx:rnd(-3,3),vy:rnd(-14,-6),life:rnd(.6,1.2),t:0,size:1,color:Math.random()<.5?"#c9a0ff":"#e8d6ff"});
}
// Beach: the pond footprint becomes a top-down sand castle (magic pond → glowing violet castle).
function drawSandCastle(p){
  const magic=p.magic;
  const sandL=magic?"#ecd3ff":"#f4e3b0", sand=magic?"#d9b6f0":"#e8d197",
        sandD=magic?"#b78fd0":"#cdad6c", sandDD=magic?"#976fb6":"#b0925a";
  ctx.fillStyle=magic?"rgba(120,90,150,.32)":"rgba(200,170,110,.38)"; tracePond(p,1.32,0); ctx.fill();
  ctx.fillStyle=magic?"#b89bd0":"#d8bd82"; tracePond(p,1.10,0); ctx.fill();          // damp sand apron
  ctx.fillStyle=sand;                       tracePond(p,0.92,0); ctx.fill();         // dry sand mound
  const cx=Math.round(p.x), cy=Math.round(p.y), s=7;
  ctx.fillStyle=sandDD; ctx.fillRect(cx-s,cy-s,2*s,2*s);                             // outer bailey wall
  ctx.fillStyle=sandD;  ctx.fillRect(cx-s,cy-s,2*s,2*s-1);
  ctx.fillStyle=sandL;  ctx.fillRect(cx-s+1,cy-s+1,2*s-2,2);                         // sun-lit wall top
  ctx.fillStyle=sandDD; ctx.fillRect(cx-4,cy-4,8,8);                                 // sunken courtyard
  ctx.fillStyle=sandD;  ctx.fillRect(cx-3,cy-3,6,6);
  for(const [dx,dy] of [[-s,-s],[s-2,-s],[-s,s-2],[s-2,s-2]]){                        // 4 corner turrets
    ctx.fillStyle=sandDD; ctx.fillRect(cx+dx-1,cy+dy-1,4,4);
    ctx.fillStyle=sand;   ctx.fillRect(cx+dx,cy+dy,3,3);
    px(cx+dx,cy+dy,1,1,sandL);
  }
  for(let i=-s+2;i<s-2;i+=3){ px(cx+i,cy-s,1,1,sandDD); px(cx+i,cy+s-1,1,1,sandDD); }// crenellation notches
  ctx.fillStyle=sandDD; ctx.beginPath(); ctx.arc(cx,cy,3.2,0,7); ctx.fill();         // central keep
  ctx.fillStyle=sand;   ctx.beginPath(); ctx.arc(cx,cy,2.1,0,7); ctx.fill();
  px(cx-1,cy-1,1,1,sandL);
  px(cx+1,cy+1,2,1,"rgba(0,0,0,.18)");                                              // flag's cast shadow
  px(cx,cy-1,1,1,"#8a6a3f");                                                         // flag pole
  px(cx+1,cy-2,3,2, magic?"#c9a0ff":"#ff6b6b");                                      // banner
  for(const sh of p.deco.pebbles){ px(sh.x,sh.y,2,1, magic?"#e6c8ff":"#f2e3b4"); px(sh.x,sh.y,1,1, magic?"#fff":"#fff8e0"); }
  if(magic && Math.random()<.15)
    parts.push({x:cx+rnd(-6,6),y:cy,vx:rnd(-3,3),vy:rnd(-14,-6),life:rnd(.6,1.2),t:0,size:1,color:Math.random()<.5?"#c9a0ff":"#e8d6ff"});
}
function drawGrove(g){ for(const t of g.trees) if(!t.dead) drawTree(t); }

function drawManaOrb(e,bob){                        // shared floating mana orb, all themes
  ctx.globalAlpha=.4; ctx.fillStyle="#c9a0ff";
  ctx.beginPath(); ctx.arc(e.x,e.y-5+bob,3.4,0,7); ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle="#a86ee8"; ctx.beginPath(); ctx.arc(e.x,e.y-5+bob,2,0,7); ctx.fill();

}
function drawManaClam(e){                           // beach: a pearl-glowing clam shell (top-down)
  const x=e.x, y=e.y;
  ctx.fillStyle="#c98fb0"; ctx.beginPath(); ctx.ellipse(x,y+1,6.5,5,0,0,7); ctx.fill();     // lower rim
  ctx.fillStyle="#f0d0e0"; ctx.beginPath(); ctx.ellipse(x,y,6,4.4,0,0,7); ctx.fill();        // shell body

  ctx.fillStyle="#5e3a6e"; ctx.beginPath(); ctx.ellipse(x,y-0.5,2.6,1.6,0,0,7); ctx.fill();

}
function drawManaGeode(e){                          // mountains: a cracked rock lined with amethyst

function drawDuck(e){

// deterministic battlefield decoration (tufts, flowers, pebbles) + border forest
let decor=[], trees=[];
function regenDecor(){
  decor=[]; trees=[];
  let s=1337; const rand=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  const density=Math.round(90*(W*H)/(26*13*CELL*CELL));   // scale scatter with board area
  for(let i=0;i<density;i++){
    const r=rand();
    decor.push({x:Math.floor(rand()*W), y:Math.floor(rand()*H),
      type: r<.5?"tuft" : r<.68?"flower" : r<.85?"pebble" : "dirt",
      c: rand()});
  }
  if(NP===3 && TRI){
    // border trees hug the three edges of the triangle
    const edges=[[TRI.p,TRI.b],[TRI.b,TRI.c],[TRI.c,TRI.p]];
    for(const [a,b] of edges){
      const len=hyp(b.x-a.x,b.y-a.y), n=Math.floor(len/13);
      for(let i=0;i<=n;i++){
        const f=i/n, x=a.x+(b.x-a.x)*f, y=a.y+(b.y-a.y)*f;
        // push each tree slightly OUTWARD from the centroid so they frame the field
        const ox=x-TRI.mid.x, oy=y-TRI.mid.y, m=hyp(ox,oy)||1;
        trees.push({x:x+ox/m*7+rand()*4-2, y:y+oy/m*7+rand()*4-2, r:5+rand()*4,
          variant:Math.floor(rand()*4), seed:rand()});
      }
    }
    return;
  }
  const spots=[];
  for(let x=-PAD/2;x<W+PAD;x+=13){ spots.push([x,-PAD/2]); spots.push([x,H+PAD/2]); }
  for(let y=6;y<H;y+=13){ spots.push([-PAD/2,y]); spots.push([W+PAD/2,y]); }
  for(const [x,y] of spots) trees.push({x:x+rand()*6-3, y:y+rand()*6-3, r:5+rand()*4,
    variant:Math.floor(rand()*4), seed:rand()});
}
regenDecor();

// grass texture: per-cell hashed dots (light/mid/dark) whose tone forms the checker grid
const GRASS = {base:"#3f5c3d", light:"#4d6e48", mid:"#446341", dark:"#334d33", darker:"#2c4430"};
function cellHash(gx,gy,i){
  let h=(gx*73856093) ^ (gy*19349663) ^ (i*83492791);
  h=(h^(h>>13))*1274126177; h=h^(h>>16);
  return (h>>>0)/4294967295;
}
function triPath(){ ctx.beginPath(); ctx.moveTo(TRI.p.x,TRI.p.y); ctx.lineTo(TRI.b.x,TRI.b.y); ctx.lineTo(TRI.c.x,TRI.c.y); ctx.closePath(); }
function drawGround3(){
  const gridOn = !(phase==="battle" && !RT);
  ctx.save(); triPath(); ctx.clip();                 // grass only inside the triangle
  ctx.fillStyle=GRASS.base; ctx.fillRect(0,0,W,H);
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    const x=gx*CELL, y=gy*CELL, even=(gx+gy)%2===0;
    for(let i=0;i<7;i++){
      const dx=Math.floor(cellHash(gx,gy,i)*(CELL-2))+1, dyy=Math.floor(cellHash(gx,gy,i+7)*(CELL-2))+1, roll=cellHash(gx,gy,i+14);
      let c;
      if(!gridOn) c=roll<.5?GRASS.mid:roll<.85?GRASS.light:GRASS.dark;
      else if(even) c=roll<.5?GRASS.light:roll<.85?GRASS.mid:GRASS.dark;
      else c=roll<.5?GRASS.dark:roll<.8?GRASS.mid:GRASS.darker;
      px(x+dx,y+dyy, roll<.3?2:1,1,c);
    }
    if(gridOn){ ctx.fillStyle=even?"rgba(255,255,255,0.025)":"rgba(0,0,0,0.05)"; ctx.fillRect(x,y,CELL,CELL); }
  }
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){    // faint per-wedge territory tint
    const cx=cellCx(gx), cy=cellCx(gy);
    if(!pointInTri(cx,cy,TRI)) continue;
    ctx.fillStyle=SIDE_META[nearestVertexSide(cx,cy,TRI)].tint; ctx.fillRect(gx*CELL,gy*CELL,CELL,CELL);
  }
  for(const d of decor){
    if(d.type==="tuft"){ px(d.x,d.y,1,3,"#2f4630"); px(d.x+2,d.y+1,1,2,"#355034"); px(d.x-1,d.y+2,1,2,"#2a3f2b"); }
    else if(d.type==="flower"){ px(d.x,d.y,2,2,d.c<.5?"#e8a6c0":"#ffd75e"); px(d.x,d.y+2,1,2,"#2f4630"); }
    else if(d.type==="pebble"){ px(d.x,d.y,3,2,"#7d8577"); px(d.x,d.y,1,1,"#9aa192"); }
    else { ctx.fillStyle="rgba(0,0,0,0.10)"; ctx.fillRect(d.x,d.y,4,3); }
  }
  for(const p of PONDS) drawPond(p);
  ctx.restore();
  ctx.strokeStyle="rgba(0,0,0,0.28)"; ctx.lineWidth=2; triPath(); ctx.stroke();   // triangle edge
}
function drawGround(){
  if(NP===3 && TRI){ drawGround3(); return; }
  // uniform grass base
  ctx.fillStyle=GRASS.base; ctx.fillRect(0,0,W,H);
  // the checker grid is a build-phase placement aid — flatten it once the turn-based battle begins
  const gridOn = !(phase==="battle" && !RT);
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    const neutral = gx>P_MAXCOL && gx<B_MINCOL;
    const x=gx*CELL, y=gy*CELL;
    if(neutral){ px(x,y,CELL,CELL, (gridOn && (gx+gy)%2)?PAL.neutral:PAL.neutralB); continue; }
    const even=(gx+gy)%2===0;
    // grass dots make the grid: even cells get light-biased dots, odd cells dark-biased
    for(let i=0;i<7;i++){
      const dx=Math.floor(cellHash(gx,gy,i)*(CELL-2))+1;
      const dyy=Math.floor(cellHash(gx,gy,i+7)*(CELL-2))+1;
      const roll=cellHash(gx,gy,i+14);
      let c;
      if(!gridOn) c = roll<.5?GRASS.mid  : roll<.85?GRASS.light : GRASS.dark;  // no checker bias during battle
      else if(even) c = roll<.5?GRASS.light : roll<.85?GRASS.mid : GRASS.dark;
      else     c = roll<.5?GRASS.dark  : roll<.8 ?GRASS.mid : GRASS.darker;
      px(x+dx,y+dyy, roll<.3?2:1, 1, c);
    }
    // faint tone shift so the checker reads at a glance
    if(gridOn){
      ctx.fillStyle = even ? "rgba(255,255,255,0.025)" : "rgba(0,0,0,0.05)";
      ctx.fillRect(x,y,CELL,CELL);
    }
  }
  // wheel ruts on the dirt road
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect((P_MAXCOL+1)*CELL+6,0,2,H); ctx.fillRect(B_MINCOL*CELL-8,0,2,H);
  ctx.fillStyle=PAL.pTint; ctx.fillRect(0,0,(P_MAXCOL+1)*CELL,H);
  ctx.fillStyle=PAL.bTint; ctx.fillRect(B_MINCOL*CELL,0,(COLS-B_MINCOL)*CELL,H);
  // decoration
  for(const d of decor){
    const onRoad = d.x>(P_MAXCOL+1)*CELL && d.x<B_MINCOL*CELL;
    if(d.type==="tuft" && !onRoad){
      px(d.x,d.y,1,3,"#2f4630"); px(d.x+2,d.y+1,1,2,"#355034"); px(d.x-1,d.y+2,1,2,"#2a3f2b");
    } else if(d.type==="flower" && !onRoad){
      px(d.x,d.y,2,2, d.c<.5?"#e8a6c0":"#ffd75e"); px(d.x,d.y+2,1,2,"#2f4630");
    } else if(d.type==="pebble"){
      px(d.x,d.y,3,2,"#7d8577"); px(d.x,d.y,1,1,"#9aa192");
    } else {
      ctx.fillStyle="rgba(0,0,0,0.10)"; ctx.fillRect(d.x,d.y,4,3);
    }
  }
  for(const p of PONDS) drawPond(p);
}

function frameRing(x,y,w,h,thick,color){    // fill just the border ring of a rectangle
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,thick);
  ctx.fillRect(x,y+h-thick,w,thick);
  ctx.fillRect(x,y,thick,h);
  ctx.fillRect(x+w-thick,y,thick,h);
}
// Beach: no border trees — the field is an island. Keep the ocean entirely in the border margin
// (never over the playfield), a single flat colour matching the outermost water, plus whitecaps.
function drawBeachShore(){
  const t=animT;
  frameRing(-PAD,-PAD, W+2*PAD, H+2*PAD, PAD, PAL.forest); // ocean fills the margin only, up to the field edge
  // drifting whitecaps in the surrounding water
  ctx.fillStyle="rgba(255,255,255,.18)";
  for(let i=0;i<28;i++){
    const xx=((i*53 + t*10) % (W+2*PAD)) - PAD;
    ctx.fillRect(xx, -PAD+((i*7)%9), 3, 1);
    ctx.fillRect(((i*47 - t*9)%(W+2*PAD))-PAD, H+PAD-2-((i*7)%8), 3, 1);

  }
}
function drawForestBorder(){

function wallAt(gx,gy){ return ents.some(e=>!e.dead && e.kind==="wall" && e.gx===gx && e.gy===gy); }
function drawWall(e){
  const x=e.gx*CELL, y=e.gy*CELL;

  px(ix,iy, CELL-(L?0:2)-(R?0:2), CELL-(U?0:2)-(D?0:2), PAL.stone);

function drawTroop(e){
  const me=facesRight(e.side), body=teamCol(e.side), dark=teamColDark(e.side);
  const bob = Math.floor(e.step)%2 ? 0 : -1;    // walk bob
  const x=e.x, y=e.y+bob;

  ctx.fillStyle="rgba(0,0,0,.25)";

    ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(x,y,4.5,0,7); ctx.fill();
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();
    px(x-1,y-1,1,1,PAL.white);

  }

    ctx.fillStyle=dark; ctx.beginPath();
    ctx.moveTo(5,0); ctx.lineTo(-4,-5); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle=body; ctx.beginPath();
    ctx.moveTo(3,0); ctx.lineTo(-2.5,-3); ctx.lineTo(-2.5,3); ctx.closePath(); ctx.fill();
    ctx.restore();
    if(e.hp<e.maxHp) drawHpBar(e,x-4,y-13,8);
  }
  else {                                         // ■ square (brute)
    px(x-5,y-5,10,10,dark);
    px(x-3.5,y-3.5,7,7,body);
    px(x-2,y-2,2,2,PAL.white);
    if(e.hp<e.maxHp) drawHpBar(e,x-5,y-15,10);
  }
}
function drawHpBar(e,x,y,w){
  x=Math.round(x); y=Math.round(y);
  const hp=Math.max(0,Math.ceil(e.hp));
  // HP number above the bar — bold with full outline for readability
  ctx.font="bold 8px monospace"; ctx.textAlign="center";
  const tx=x+w/2, ty=y-3;
  ctx.fillStyle="#10121c";
  ctx.fillText(hp,tx-1,ty); ctx.fillText(hp,tx+1,ty);
  ctx.fillText(hp,tx,ty-1); ctx.fillText(hp,tx,ty+1);
  ctx.fillStyle=PAL.white; ctx.fillText(hp,tx,ty);
  // outlined frame, bar inside
  px(x-1,y-1,w+2,5,"#10121c");
  px(x,y,w,3,"#2a2f45");
  const fw=Math.max(0,Math.round(w*e.hp/e.maxHp));
  px(x,y,fw,3, e.hp/e.maxHp>.4?PAL.good:"#ff6b6b");
  if(fw>1) px(x,y,fw,1,"rgba(255,255,255,.35)");
}

// range ring shown while the cursor is over a projectile shooter (tower / turret / archer)
function rangeOf(e){
  if(e.kind==="tower")  return TOWER_LEVELS[e.level||1].range;
  if(e.kind==="turret") return tstat(e.side,"turret","range");
  if(e.kind==="archer") return tstat(e.side,"archer","range");
  return 0;
}
let showRanges=null;   // null | "p" (blue) | "b" (red) | "both" — toggled by the range bar
function drawAllRanges(){
  if(!showRanges) return;
  for(const e of ents){
    if(e.dead || !rangeOf(e)) continue;
    if(showRanges!=="both" && e.side!==showRanges) continue;
    const col=teamCol(e.side);
    ctx.globalAlpha=.5; ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.setLineDash([3,3]); ctx.lineDashOffset=-animT*8;
    ctx.beginPath(); ctx.arc(e.x,e.y,rangeOf(e),0,7); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
}
function shooterUnderCursor(){
  if(!hover) return null;
  let best=null, bd=1e9;
  for(const e of ents){
    if(e.dead || !rangeOf(e)) continue;
    const d=hyp(hover.x-e.x, hover.y-e.y);
    if(d<=bodyR(e)+3 && d<bd){ bd=d; best=e; }
  }
  return best;
}
function drawRangeHover(){
  const e=shooterUnderCursor();
  if(!e) return;
  const r=rangeOf(e), col=teamCol(e.side);
  ctx.globalAlpha=.10; ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(e.x,e.y,r,0,7); ctx.fill();
  ctx.globalAlpha=.75; ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.setLineDash([4,3]); ctx.lineDashOffset=-animT*10;
  ctx.beginPath(); ctx.arc(e.x,e.y,r,0,7); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
}
function drawGhost(){
  if(!selected||!hover||!canBuild()) return;
  if(selected==="sell"){
    const e=sellableAt(mySide,hover.gx,hover.gy);
    if(e){
      const w=(e.gw||1)*CELL, h=(e.gh||1)*CELL;
      ctx.globalAlpha=.35; px(e.gx*CELL,e.gy*CELL,w,h,PAL.gold); ctx.globalAlpha=.9;
      ctx.strokeStyle=PAL.gold; ctx.lineWidth=1;
      ctx.strokeRect(e.gx*CELL+.5,e.gy*CELL+.5,w-1,h-1);
      ctx.font="bold 8px monospace"; ctx.textAlign="center"; ctx.fillStyle=PAL.gold;
      ctx.fillText("+"+Math.floor(KINDS[e.kind].cost*SELL_RATE), e.x, e.gy*CELL-3);
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=.3;
      px(hover.gx*CELL,hover.gy*CELL,CELL,CELL,"#ff6b6b");
      ctx.globalAlpha=1;
    }
    return;
  }
  const k=KINDS[selected];
  const ok = canPlace(hover.gx,hover.gy) && (k.spell?magics[mySide]:golds[mySide])>=k.cost;
  if(k.spell){

    const rr=tstat(mySide,selected,"radius");
    const x=cellCx(hover.gx), y=cellCx(hover.gy);
    const cols={heal:["#6ee77a","#a8f5b4"], shield:["#7db4ff","#bcd8ff"], fireball:["#ff9c40","#ffd75e"]};
    const c=cols[selected]||cols.fireball;
    const cFill= !ok?"#ff6b6b" : c[0];
    const cEdge= !ok?"#ff6b6b" : c[1];
    ctx.globalAlpha=.22;
    ctx.fillStyle=cFill;
    ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();
    ctx.globalAlpha=.8;
    ctx.strokeStyle=cEdge; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.stroke();
    px(x-1,y-1,3,3,cEdge);
    ctx.globalAlpha=1;
    return;
  }
  ctx.globalAlpha=.45;
  px(hover.gx*CELL,hover.gy*CELL,(k.gw||1)*CELL,(k.gh||1)*CELL, ok?"#6ee77a":"#ff6b6b");

function drawSpellMarkers(){
  if(phase!=="build" && !waitingOrders && myMarkers.length===0) return;
  for(const m of myMarkers){
    const rr=tstat(mySide,m.kind,"radius")||KINDS.fireball.radius;
    const cols={heal:["#6ee77a","#d9ffe0"], shield:["#7db4ff","#bcd8ff"], fireball:["#ff9c40","#ffd75e"]};
    const [c1,c2]=cols[m.kind]||cols.fireball;
    const pulse=1+Math.sin(animT*5)*.06;
    ctx.setLineDash([5,4]); ctx.lineDashOffset=-animT*14;
    ctx.strokeStyle=c1; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(m.x,m.y,rr*pulse,0,7); ctx.stroke();
    ctx.setLineDash([]);
    px(m.x-3,m.y,7,1,c1); px(m.x,m.y-3,1,7,c1);   // crosshair
    px(m.x-1,m.y-1,3,3,c2);
  }
}
function drawScorches(){
  for(const s of scorches){
    const a=Math.max(0, .55*(1-s.t/s.life));
    ctx.globalAlpha=a;
    ctx.fillStyle="#17130d";
    ctx.beginPath(); ctx.arc(s.x,s.y,26,0,7); ctx.fill();
    ctx.fillStyle="#241c11";
    ctx.beginPath(); ctx.arc(s.x-4,s.y+3,14,0,7); ctx.fill();
    // charred flecks
    px(s.x+8,s.y-6,2,1,"#0d0b07"); px(s.x-12,s.y+2,2,2,"#0d0b07"); px(s.x+3,s.y+11,1,2,"#0d0b07");
    ctx.globalAlpha=1;
  }
}
function drawFireballs(){
  for(const f of fireballs){
    if(f.x===undefined) continue;
    // ground shadow (shrinks as the fireball climbs)
    const h=f.arc||0;
    ctx.globalAlpha=.28*(1-h/70);
    ctx.fillStyle="#000";
    ctx.beginPath(); ctx.ellipse(f.x,f.y,4-h*.02,2,0,0,7); ctx.fill();
    ctx.globalAlpha=1;
    // glowing core, drawn at arc height
    const y=f.y-h, flick=Math.sin(animT*40)*0.6;
    const heal=f.kind==="heal";
    const glow=heal?"#6ee77a":"#ff8c2e", mid=heal?"#6ee77a":"#ff8c2e",
          core=heal?"#d9ffe0":"#ffd75e", spark=heal?"#ffffff":"#fff7d6";
    ctx.globalAlpha=.35; ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(f.x,y,6.5+flick,0,7); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle=mid; ctx.beginPath(); ctx.arc(f.x,y,3.6,0,7); ctx.fill();
    ctx.fillStyle=core; ctx.beginPath(); ctx.arc(f.x-.5,y-.5,2.2,0,7); ctx.fill();
    px(f.x-1,y-1,1,1,spark);
  }
}

function render(){
  ctx.save();
  // forest floor fills everything (incl. border pad)
  ctx.fillStyle=PAL.forest; ctx.fillRect(0,0,W+2*PAD,H+2*PAD);
  if(shake>0 && shakeMul>0){ const s=shake*shakeMul; ctx.translate(rnd(-s,s),rnd(-s,s)); }
  ctx.translate(PAD,PAD);
  drawGround();
  drawScorches();
  drawHealZones();
  drawMoneybags();
  drawForestBorder();
  drawGhost();
  drawSpellMarkers();
  // sort by y for pseudo-depth
  const sorted=[...ents].sort((a,b)=>a.y-b.y);
  for(const e of sorted){
    if(e.selling) continue;                       // sold: hidden immediately (removed when the turn resolves)
    if(e.kind==="tower") drawTowerSpr(e);
    else if(e.kind==="wall") drawWall(e);
    else if(e.kind==="harvester") drawHarvester(e);
    else if(e.kind==="turret") drawTurret(e);
    else if(e.kind==="catapult") drawCatapult(e);
    else if(e.kind==="spikes") drawSpikes(e);
    else if(e.kind==="duck") drawDuck(e);
    else if(e.kind==="magicwell") drawMagicWell(e);
    else drawTroop(e);
  }
  drawFires();
  drawStatusFx();
  drawAllRanges();
  drawRangeHover();
  // grove canopies sit above units for depth
  for(const g of GROVES) drawGrove(g);
  drawFireballs();
  // projectiles
  for(const p of projs){
    if(p.pkind==="water"){
      if(SCENE.proj.shape==="rock"){                 // mountains: tumbling stone
        ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,7); ctx.fill();
        px(p.x-1,p.y-1,1,1,"#e0d6c4");
      } else if(SCENE.proj.shape==="ball"){          // beach: striped beach ball
        ctx.fillStyle="#fdfdfd"; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill();
        ctx.fillStyle=p.color;  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.arc(p.x,p.y,3,-0.5,0.7); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#5fb0e4"; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.arc(p.x,p.y,3,2.0,3.2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle="rgba(0,0,0,.2)"; ctx.lineWidth=.5; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.stroke();
      } else {                                        // forest: wobbling water droplet
        ctx.fillStyle="#7db4ff"; ctx.beginPath(); ctx.arc(p.x,p.y+Math.sin(animT*30)*.5,2,0,7); ctx.fill();
        px(p.x-1,p.y-1,1,1,"#cfe7ff");
      }
    }
    else if(p.pkind==="ball"){
      // cannonball: glow + dark ball + highlight
      ctx.globalAlpha=.35; ctx.fillStyle="#ffb347";
      ctx.beginPath(); ctx.arc(p.x,p.y,4,0,7); ctx.fill(); ctx.globalAlpha=1;
      ctx.fillStyle="#2b2b33"; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
      px(p.x-1,p.y-1,1,1,"#8a8a99");
    }
    else if(p.pkind==="boulder"){
      // catapult boulder: an arcing rock with a ground shadow beneath it
      const h = Math.sin(Math.min(1,p.t0/(p.flight||1))*Math.PI)*(p.arc||24);
      ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(p.x,p.y,3.2,1.6,0,0,7); ctx.fill();
      const by=p.y-h;
      ctx.fillStyle="#6a5a44"; ctx.beginPath(); ctx.arc(p.x,by,3.4,0,7); ctx.fill();
      ctx.fillStyle="#9a8763"; ctx.beginPath(); ctx.arc(p.x-0.8,by-0.8,2.1,0,7); ctx.fill();
      px(p.x-1,by-1,1,1,"#c3b088");
    } else {
      // arrow: shaft along velocity + bright tip
      const m=Math.hypot(p.vx,p.vy)||1, ux=p.vx/m, uy=p.vy/m;
      ctx.strokeStyle=p.color; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x-ux*4,p.y-uy*4); ctx.lineTo(p.x+ux*3,p.y+uy*3); ctx.stroke();
      px(p.x+ux*3,p.y+uy*3,1,1,PAL.white);
    }
  }
  // particles
  for(const p of parts){
    if(p.flash){
      ctx.globalAlpha=1-(p.t/p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-p.t/p.life*.4),0,7); ctx.fill();
      ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=Math.max(0,1-p.t/p.life);
      px(p.x,p.y,p.size,p.size,p.color);
      ctx.globalAlpha=1;
    }
  }
  // floating texts
  ctx.font="7px monospace"; ctx.textAlign="center";
  for(const t of texts){
    ctx.globalAlpha=Math.max(0,1-t.t/t.life);
    ctx.fillStyle=t.color;
    ctx.fillText(t.str,t.x,t.y-t.t*18);
    ctx.globalAlpha=1;
  }
  // battle phase vignette label
  if(phase==="battle"){
    ctx.fillStyle="rgba(255,215,94,.9)"; ctx.font="bold 8px monospace";
    ctx.fillText("⚔ BATTLE "+Math.ceil(BATTLE_MAX-battleT)+"s ⚔", W/2, 10);
  }
  ctx.restore();
}

// ============================== LOOP ==============================
// battle sim runs at a FIXED timestep so both online clients compute identical battles
const SIM_STEP=1/60;
let acc=0;
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  animT+=dt;
  shake=Math.max(0,shake-dt*22);
  if(menuOpen && !musicOn) startMusic();               // chiptune plays on the main menu only
  else if(!menuOpen && musicOn) stopMusic();
  if(phase==="battle"){
    acc+=dt;
    while(acc>=SIM_STEP && phase==="battle"){ updateBattle(SIM_STEP); acc-=SIM_STEP; }
  } else acc=0;
  for(const p of parts){ p.t+=dt; p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt; if(p.vy!==undefined&&!p.flash)p.vy+=60*dt; }
  parts=parts.filter(p=>p.t<p.life);
  for(const t of texts) t.t+=dt;
  texts=texts.filter(t=>t.t<t.life);
  for(const s of scorches) s.t+=dt;
  scorches=scorches.filter(s=>s.t<s.life);
  render();
  requestAnimationFrame(loop);
}

function peerReady(){
  if(typeof Peer==="undefined"){
    setMenuStatus("Online play unavailable — couldn't load PeerJS (check your connection).","");
    return false;
  }
  return true;
}
function cleanupNet(){
  try{ if(conn) conn.close(); }catch(e){}
  for(const g of guests){ try{ if(g.conn) g.conn.close(); }catch(e){} }
  guests=[];
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=conn=null; isHost=false; oppOrders=null; myCommitted=false; myReport=null; oppReport=null;
  hostingCode=null; netN=2;
}
function sendMsg(m){ if(conn&&conn.open) conn.send(m); }

function bindConn(){
  conn.on("data", m=>{
    if(!m||typeof m!=="object") return;
    if(m.type==="hello" && isHost){
      // guest's handlers are provably live now → safe to start
      if(mode==="online" && !menuOpen) return;      // already started
      const seed=Math.floor(Math.random()*2**31);
      sendMsg({type:"start", seed, scene:sceneKey});  // host's map/theme is authoritative
      setMenuStatus("","");
      beginMatch({mode:"online", seed, side:"p"});
    }
    else if(m.type==="start" && !isHost){
      if(mode==="online" && !menuOpen) return;      // already started
      if(m.scene) applyScene(m.scene);              // adopt the host's map/theme
      netN=m.players||2;
      setMenuStatus("","");
      beginMatch({mode:"online", seed:m.seed, side:m.side||"b", players:netN});
    }
    else if(m.type==="orders" && isHost){ oppOrders=Array.isArray(m.orders)?m.orders:[]; tryResolveP2P(); }
    else if(m.type==="resolve" && !isHost){ resolveOrders(m.data||{}); }
    else if(m.type==="report" && isHost){ oppReport=m.rep; checkReports(); }
    else if(m.type==="desync"){ showBanner("⚠️ DESYNC — game state diverged","var(--accent)"); }
  });
  conn.on("close", ()=>{ if(!over && !menuOpen) showBanner("🏳️ Opponent left the game","var(--good)"); });
  conn.on("error", ()=>{ if(!over && !menuOpen) showBanner("⚠️ Connection lost","var(--accent)"); });
}

// host: when both players' orders are in, pair them and start the battle on both ends
function tryResolveP2P(){
  if(!isHost || !myCommitted || !oppOrders) return;
  const data={p:myOrders, b:oppOrders};        // host is always side "p"
  myCommitted=false; oppOrders=null;
  sendMsg({type:"resolve", data});
  resolveOrders(data);
}
// host (3-player hub): resolve once the host committed AND both guests' orders arrived
function tryResolveP2P3(){
  if(!isHost || netN!==3 || !myCommitted) return;
  if(guests.length<2 || !guests.every(g=>g.orders)) return;
  const data={p:myOrders};                     // host is always side "p"; guests are "b" and "c"
  for(const g of guests) data[g.side]=g.orders;
  myCommitted=false; for(const g of guests) g.orders=null;
  broadcast({type:"resolve", data});
  resolveOrders(data);
}
// host: per-guest message handler (3-player)
function bindGuestConn(g){
  g.conn.on("data", m=>{
    if(!m||typeof m!=="object") return;
    if(m.type==="hello"){
      if(!menuOpen) return;                    // already started
      g.helloed=true;
      const n=guests.filter(x=>x.helloed).length;
      setMenuStatus(`Waiting for players… (${n}/2 joined)`, hostingCode);
      if(guests.length===2 && guests.every(x=>x.helloed)){
        const seed=Math.floor(Math.random()*2**31);
        for(const gg of guests) gg.conn.send({type:"start", seed, scene:sceneKey, side:gg.side, players:3});
        setMenuStatus("","");
        beginMatch({mode:"online", seed, side:"p", players:3});
      }
    }
    else if(m.type==="orders"){ g.orders=Array.isArray(m.orders)?m.orders:[]; tryResolveP2P3(); }
  });
  g.conn.on("close", ()=>{ if(!over && !menuOpen) showBanner("🏳️ A player left the game","var(--good)"); });
  g.conn.on("error", ()=>{ if(!over && !menuOpen) showBanner("⚠️ Connection lost","var(--accent)"); });
}
function checkReports(){
  if(!myReport || !oppReport) return;
  if(JSON.stringify(myReport)!==JSON.stringify(oppReport)){
    sendMsg({type:"desync"});
    showBanner("⚠️ DESYNC — game state diverged","var(--accent)");
  }
  myReport=null; oppReport=null;
}

function hostRoom(size){
  if(!peerReady()) return;
  cleanupNet();
  netN=size; isHost=true;
  const code=makeCode();
  setMenuStatus("Setting up room…","");
  peer=new Peer(peerId(code), PEER_OPTS);
  peer.on("open", ()=>{
    hostingCode=code;
    setMenuStatus(size===3 ? "Share this code — waiting for 2 players to join:"
                           : "Share this code with a friend (they join from their own device or a 2nd window):", code);
  });
  peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on("error", err=>{
    if(err.type==="unavailable-id") hostRoom(size);   // code collision → roll a new one
    else if(err.type==="network") setMenuStatus("Can't reach the connection broker — check your internet and try again.","");
    else setMenuStatus("Error: "+err.type,"");
  });
  peer.on("connection", c=>{
    isHost=true;
    if(size===3){
      if(guests.length>=2 || !menuOpen){ try{c.close();}catch(e){} return; }   // room full / already started
      const g={conn:c, side: guests.length===0?"b":"c", orders:null, helloed:false};
      guests.push(g);
      bindGuestConn(g);                               // bind BEFORE open — no message can be missed
      const onOpen=()=>setMenuStatus(`Player connected (${guests.length}/2)…`, hostingCode);
      if(c.open) onOpen(); else c.on("open", onOpen);
      return;
    }
    if(conn && conn.open){ try{c.close();}catch(e){} return; }   // 2-player room is full
    conn=c;
    bindConn();                                       // bind BEFORE open — no message can be missed
    const onOpen=()=>setMenuStatus("Player connected — starting…","");
    if(c.open) onOpen(); else c.on("open", onOpen);
  });
}
function menuJoin(){
  if(!peerReady()) return;
  const code=document.getElementById("joinCode").value.trim().toUpperCase();
  if(code.length!==4){ setMenuStatus("Enter the 4-letter room code.",""); return; }
  if(hostingCode===code){
    setMenuStatus("That's your own room! Keep this window as host — open the game in a 2nd window (or on another device) and join from there.","");
    return;
  }
  cleanupNet();
  setMenuStatus("Joining "+code+"…","");
  let attempts=0, joined=false;
  peer=new Peer(PEER_OPTS);
  peer.on("disconnected", ()=>{ try{ peer.reconnect(); }catch(e){} });
  function tryConnect(){
    if(joined || !menuOpen) return;
    attempts++;
    setMenuStatus(`Joining ${code}… (attempt ${attempts}/4)`,"");
    conn=peer.connect(peerId(code),{reliable:true});
    isHost=false;
    bindConn();                                     // bind BEFORE open — no message can be missed
    const retryTimer=setTimeout(()=>{
      if(joined) return;
      try{ conn.close(); }catch(e){}
      if(attempts<4) tryConnect();
      else setMenuStatus("Couldn't connect. Is the host's room screen still open? Very strict networks can also block the connection — try a phone hotspot.","");
    }, 6000);
    conn.on("open", ()=>{
      joined=true; clearTimeout(retryTimer);
      setMenuStatus("Connected — starting…","");
      sendMsg({type:"hello"});                      // host replies with "start" + seed
    });
  }
  peer.on("error", err=>{
    if(err.type==="peer-unavailable"){
      // host may still be registering — the retry loop will try again
      if(attempts>=4) setMenuStatus(`Room ${code} not found. Double-check the code — and make sure the host still has the room screen open.`,"");
    }
    else if(err.type==="network") setMenuStatus("Can't reach the connection broker — check your internet and try again.","");
    else setMenuStatus("Error: "+err.type,"");
  });
  peer.on("open", tryConnect);
}

function canvasPos(ev){
  const r=cv.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width*(W+2*PAD)-PAD, y=(ev.clientY-r.top)/r.height*(H+2*PAD)-PAD;
  return {x,y,gx:Math.floor(x/CELL),gy:Math.floor(y/CELL)};
}
cv.addEventListener("mousemove",ev=>{ hover=canvasPos(ev); });
cv.addEventListener("mouseleave",()=>{ hover=null; });
cv.addEventListener("click",ev=>{
  ac(); // unlock audio
  if(!selected||!canBuild()) return;
  const p=canvasPos(ev);
  if(selected==="sell"){ sellAt(p.gx,p.gy); return; }
  place(selected,p.gx,p.gy);
});
cv.addEventListener("contextmenu",ev=>{ ev.preventDefault(); selected=null; refreshUI(); });
window.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ selected=null; refreshUI(); } });

// ---- touch: press & drag to aim the ghost, lift to place (mirrors mouse) ----
function touchPos(t){
  const r=cv.getBoundingClientRect();
  const x=(t.clientX-r.left)/r.width*(W+2*PAD)-PAD, y=(t.clientY-r.top)/r.height*(H+2*PAD)-PAD;
  return {x,y,gx:Math.floor(x/CELL),gy:Math.floor(y/CELL)};
}
cv.addEventListener("touchstart",ev=>{
  ac();                                        // unlock audio on first touch
  if(ev.touches.length){ hover=touchPos(ev.touches[0]); }
  ev.preventDefault();
},{passive:false});
cv.addEventListener("touchmove",ev=>{
  if(ev.touches.length){ hover=touchPos(ev.touches[0]); }
  ev.preventDefault();
},{passive:false});
cv.addEventListener("touchend",ev=>{
  ev.preventDefault();                         // also suppresses the synthetic click (no double-place)
  if(hover && selected && canBuild()){
    if(selected==="sell") sellAt(hover.gx,hover.gy);
    else place(selected,hover.gx,hover.gy);
  }
  hover=null;                                  // clear the ghost after lifting
},{passive:false});

// scene picker: swap the battlefield theme (purely visual)
document.querySelectorAll("#sceneSel button").forEach(b=>{
  b.onclick=()=>applyScene(b.dataset.scene);
});

// range bar: persistently show attack ranges for one or both sides
function updateRangeBar(){
  document.querySelectorAll("#rangeBar button").forEach(b=>b.classList.toggle("on", showRanges===b.dataset.r));
}
document.querySelectorAll("#rangeBar button").forEach(b=>{
  b.onclick=()=>{ showRanges = showRanges===b.dataset.r ? null : b.dataset.r; updateRangeBar(); };
});

// settings sliders (SFX / music / screen shake), remembered across sessions
{
  const THUMB=14;
  // fill the track up to the THUMB CENTRE (which travels thumb/2 .. width-thumb/2), so the
  // yellow fill's leading edge always lines up with the thumb instead of racing ahead of it
  function wireSlider(id,pctId,initial,onInput,onRelease){
    const slider=document.getElementById(id), pct=document.getElementById(pctId);
    function paint(){
      const tw=slider.clientWidth||150, frac=(slider.value-slider.min)/(slider.max-slider.min);
      const pos=(THUMB/2 + frac*(tw-THUMB))/tw*100;
      slider.style.background=`linear-gradient(to right, var(--accent) 0%, var(--accent) ${pos}%, #333a5c ${pos}%, #333a5c 100%)`;
    }
    slider.value=initial; pct.textContent=slider.value+"%"; paint();
    slider.oninput=()=>{ onInput(+slider.value); pct.textContent=slider.value+"%"; paint(); };
    if(onRelease) slider.onchange=()=>onRelease(+slider.value);
  }
  wireSlider("volSlider","volPct",Math.round(sndVol*100),
    v=>setVolume(v/100),
    ()=>{ audioUnlocked=true; ac(); sfx("place"); });                 // audible preview on release
  wireSlider("musSlider","musPct",Math.round(musVol*100),
    v=>setMusicVol(v/100),
    ()=>{ audioUnlocked=true; if(menuOpen && !musicOn) startMusic(); });
  wireSlider("shakeSlider","shakePct",Math.round(shakeMul*100),
    v=>setShakeMul(v/100),
    ()=>{ shake=Math.min(shake+5,8); });                              // visible preview on release
}

// boot: pretty battlefield behind the menu
beginMatch({mode:"bot"});
menuOpen=true;
document.getElementById("menu").classList.remove("hidden");
applyScene("forest");
refreshUI();
requestAnimationFrame(loop);
</script>
